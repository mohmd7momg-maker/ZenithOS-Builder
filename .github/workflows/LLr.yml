name: Build Lightweight Arabic Live ISO

on:
  workflow_dispatch:
  push:
    tags: ['v*.*']

env:
  DISTRO_NAME: "MyLive"
  DISTRO_FULLNAME: "My Light Live"
  SYSTEM_LOCALE: "ar_SA.UTF-8"
  KEYBOARD_LAYOUT: "ara,us"
  WALLPAPER_URL: "https://raw.githubusercontent.com/GNOME/backgrounds/main/backgrounds/adwaita-d.jpg"

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build Environment Prep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y live-build debian-archive-keyring
          curl -sO http://ftp.us.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2023.4_all.deb
          sudo dpkg -i debian-archive-keyring_2023.4_all.deb || true

      - name: Run Full Build Simulation
        run: |
          set -e
          mkdir -p live-work && cd live-work
          sudo lb clean --purge || true
          
          lb config noauto \
            --mode "debian" \
            --distribution "bookworm" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --security false --updates false \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-images "iso-hybrid" \
            --iso-application "${{ env.DISTRO_FULLNAME }}" \
            --iso-volume "MyLive" \
            --chroot-filesystem squashfs
          
          # [تصحيح المحاكاة 1]: ضبط الأذونات قبل البناء
          mkdir -p config/includes.chroot/etc/default
          
          # [تصحيح المحاكاة 2]: كتابة ملفات النظام الأساسية
          echo "LANG=${{ env.SYSTEM_LOCALE }}" > config/includes.chroot/etc/default/locale
          
          # [تصحيح المحاكاة 3]: التأكد من ملكية المجلدات لـ root
          sudo chown -R root:root config/includes.chroot/
          
          # إضافة الحزم الأساسية
          echo "linux-image-amd64 live-boot live-config task-lxde-desktop" > config/package-lists/base.list.chroot
          
          # تنفيذ البناء ببيئة نظيفة
          sudo env -i HOME=$HOME PATH=$PATH lb build
          
          mkdir -p ../output && cp live-image-amd64.hybrid.iso ../output/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ISO-Output
          path: output/
