name: Build Lightweight Arabic Live ISO

on:
  workflow_dispatch:
  push:
    tags: ['v*.*']

env:
  DISTRO_NAME: "MyLive"
  DISTRO_FULLNAME: "My Light Live"
  SYSTEM_LOCALE: "ar_SA.UTF-8"
  KEYBOARD_LAYOUT: "ara,us"
  WALLPAPER_URL: "https://raw.githubusercontent.com/GNOME/backgrounds/main/backgrounds/adwaita-d.jpg"
  BG_COLOR: "#2E3440"

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean

      - name: Install Dependencies and Update Keyring
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y debian-archive-keyring curl gnupg wget xorriso isolinux mtools grub-efi-amd64-bin grub-pc-bin squashfs-tools debootstrap
          wget -q "http://ftp.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2023.3+deb12u2_all.deb"
          sudo dpkg -i debian-archive-keyring_2023.3+deb12u2_all.deb
          rm -f debian-archive-keyring_2023.3+deb12u2_all.deb
          sudo apt-get update -qq || true

      - name: Build Live ISO
        run: |
          set -e
          WORK_DIR="$GITHUB_WORKSPACE/work"
          OUTPUT_DIR="$GITHUB_WORKSPACE/output"
          ROOTFS="$WORK_DIR/rootfs"
          ISODIR="$WORK_DIR/iso"
          
          mkdir -p "$ROOTFS" "$ISODIR/live" "$ISODIR/boot/isolinux" "$ISODIR/boot/grub" "$ISODIR/EFI/boot" "$OUTPUT_DIR"
          
          # ---------- debootstrap ----------
          sudo debootstrap --arch=amd64 --include=ca-certificates,locales,sudo,wget,curl bookworm "$ROOTFS" http://deb.debian.org/debian/
          
          # ---------- إعداد بيئة chroot ----------
          sudo mount --bind /dev "$ROOTFS/dev"
          sudo mount --bind /dev/pts "$ROOTFS/dev/pts"
          sudo mount -t proc proc "$ROOTFS/proc"
          sudo mount -t sysfs sysfs "$ROOTFS/sys"
          
          # ---------- كتابة سكربت chroot عبر echo ----------
          sudo tee "$ROOTFS/tmp/setup.sh" > /dev/null << 'EOF'
          #!/bin/bash
          set -e
          
          echo "deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware" > /etc/apt/sources.list
          echo "deb http://deb.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware" >> /etc/apt/sources.list
          echo "deb http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware" >> /etc/apt/sources.list
          apt-get update -qq
          
          apt-get install -y --no-install-recommends \
            linux-image-amd64 live-boot live-config live-config-systemd \
            user-setup sudo firmware-linux-free \
            xserver-xorg-video-all xserver-xorg-input-all dbus-x11 \
            task-lxde-desktop lightdm network-manager network-manager-gnome \
            arc-theme papirus-icon-theme zram-tools locales \
            fonts-noto-core fonts-kacst grub-pc-bin grub-efi-amd64-bin syslinux isolinux
          
          echo "ar_SA.UTF-8 UTF-8" > /etc/locale.gen
          echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
          locale-gen
          echo "LANG=ar_SA.UTF-8" > /etc/default/locale
          
          echo 'XKBMODEL="pc105"' > /etc/default/keyboard
          echo 'XKBLAYOUT="ara,us"' >> /etc/default/keyboard
          echo 'XKBOPTIONS="grp:alt_shift_toggle"' >> /etc/default/keyboard
          
          mkdir -p /etc/lightdm
          printf '[Seat:*]\nautologin-user=user\nautologin-user-timeout=0\nuser-session=LXDE\n' > /etc/lightdm/lightdm.conf
          
          for service in ModemManager bluetooth cups avahi-daemon; do
            systemctl disable "$service" 2>/dev/null || true
          done
          
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          EOF
          
          sudo chmod +x "$ROOTFS/tmp/setup.sh"
          sudo chroot "$ROOTFS" /bin/bash /tmp/setup.sh
          
          sudo umount -lf "$ROOTFS/dev/pts" "$ROOTFS/dev" "$ROOTFS/proc" "$ROOTFS/sys" || true
          
          # ---------- squashfs ----------
          sudo mksquashfs "$ROOTFS" "$ISODIR/live/filesystem.squashfs" -comp xz -b 1M -noappend
          printf '%s' "$(sudo du -sx --block-size=1 "$ROOTFS" | cut -f1)" | sudo tee "$ISODIR/live/filesystem.size" > /dev/null
          
          # ---------- kernel ----------
          sudo cp "$ROOTFS"/boot/vmlinuz-* "$ISODIR/live/vmlinuz"
          sudo cp "$ROOTFS"/boot/initrd.img-* "$ISODIR/live/initrd"
          
          # ---------- boot configs ----------
          sudo cp /usr/lib/ISOLINUX/isolinux.bin "$ISODIR/boot/isolinux/"
          sudo cp /usr/lib/syslinux/modules/bios/menu.c32 "$ISODIR/boot/isolinux/"
          sudo cp /usr/lib/syslinux/modules/bios/ldlinux.c32 "$ISODIR/boot/isolinux/"
          sudo cp /usr/lib/syslinux/modules/bios/libutil.c32 "$ISODIR/boot/isolinux/"
          
          echo 'UI menu.c32' | sudo tee "$ISODIR/boot/isolinux/isolinux.cfg" > /dev/null
          echo 'PROMPT 0' | sudo tee -a "$ISODIR/boot/isolinux/isolinux.cfg" > /dev/null
          echo 'TIMEOUT 50' | sudo tee -a "$ISODIR/boot/isolinux/isolinux.cfg" > /dev/null
          echo 'DEFAULT live' | sudo tee -a "$ISODIR/boot/isolinux/isolinux.cfg" > /dev/null
          echo 'LABEL live' | sudo tee -a "$ISODIR/boot/isolinux/isolinux.cfg" > /dev/null
          echo '  MENU LABEL MyLive – Live Session' | sudo tee -a "$ISODIR/boot/isolinux/isolinux.cfg" > /dev/null
          echo '  KERNEL /live/vmlinuz' | sudo tee -a "$ISODIR/boot/isolinux/isolinux.cfg" > /dev/null
          echo '  APPEND initrd=/live/initrd boot=live quiet splash locales=ar_SA.UTF-8 keyboard-layouts=ara,us keyboard-options=grp:alt_shift_toggle' | sudo tee -a "$ISODIR/boot/isolinux/isolinux.cfg" > /dev/null
          
          echo 'set timeout=5' | sudo tee "$ISODIR/boot/grub/grub.cfg" > /dev/null
          echo 'menuentry "MyLive – Live Session" {' | sudo tee -a "$ISODIR/boot/grub/grub.cfg" > /dev/null
          echo '  linux /live/vmlinuz boot=live quiet splash locales=ar_SA.UTF-8 keyboard-layouts=ara,us keyboard-options=grp:alt_shift_toggle' | sudo tee -a "$ISODIR/boot/grub/grub.cfg" > /dev/null
          echo '  initrd /live/initrd' | sudo tee -a "$ISODIR/boot/grub/grub.cfg" > /dev/null
          echo '}' | sudo tee -a "$ISODIR/boot/grub/grub.cfg" > /dev/null
          
          # ---------- EFI ----------
          sudo grub-mkstandalone --format=x86_64-efi --output="$ISODIR/EFI/boot/bootx64.efi" \
            --modules="part_gpt part_msdos fat iso9660 search search_label linux linuxefi echo configfile all_video gfxterm" \
            "boot/grub/grub.cfg=$ISODIR/boot/grub/grub.cfg"
          sudo dd if=/dev/zero of="$ISODIR/EFI/boot/efiboot.img" bs=1M count=8
          sudo mkfs.fat -n EFIBOOT "$ISODIR/EFI/boot/efiboot.img"
          sudo mmd -i "$ISODIR/EFI/boot/efiboot.img" ::/EFI ::/EFI/BOOT
          sudo mcopy -i "$ISODIR/EFI/boot/efiboot.img" "$ISODIR/EFI/boot/bootx64.efi" ::/EFI/BOOT/BOOTX64.EFI
          
          # ---------- ISO ----------
          sudo xorriso -as mkisofs \
            -iso-level 3 -volid "MyLive" \
            -b boot/isolinux/isolinux.bin -c boot/isolinux/boot.cat \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -eltorito-alt-boot -e EFI/boot/efiboot.img -no-emul-boot \
            -isohybrid-mbr /usr/lib/ISOLINUX/isohdpfx.bin \
            -output "$OUTPUT_DIR/${{ env.DISTRO_NAME }}.iso" "$ISODIR"
          
          sudo sha256sum "$OUTPUT_DIR/${{ env.DISTRO_NAME }}.iso" | sudo tee "$OUTPUT_DIR/${{ env.DISTRO_NAME }}.iso.sha256" > /dev/null

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DISTRO_NAME }}-ISO
          path: output/
          retention-days: 7
          compression-level: 0

      - name: Create Release (on tags)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ env.DISTRO_FULLNAME }} ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: output/${{ env.DISTRO_NAME }}.iso
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
