name: Build Lightweight Arabic Live ISO

on:
  workflow_dispatch:
  push:
    tags: ['v*.*']

env:
  DISTRO_NAME: "MyLive"
  DISTRO_FULLNAME: "My Light Live"
  SYSTEM_LOCALE: "ar_SA.UTF-8"
  KEYBOARD_LAYOUT: "ara,us"
  WALLPAPER_URL: "https://raw.githubusercontent.com/GNOME/backgrounds/main/backgrounds/adwaita-d.jpg"
  BG_COLOR: "#2E3440"

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up Disk Space & Clean Environment
        run: |
          sudo systemctl stop unattended-upgrades || true
          sudo killall apt apt-get || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          sudo apt-get clean

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y live-build debian-keyring debian-archive-keyring curl gnupg wget xorriso isolinux mtools grub-efi-amd64-bin grub-efi-ia32-bin grub-pc-bin squashfs-tools

      - name: Build System
        run: |
          set -e
          mkdir -p live-work && cd live-work
          # تنظيف جذري لضمان عدم بقاء أي إعدادات للمستودعات القديمة
          sudo rm -rf config/
          sudo lb clean --purge || true
          
          lb config noauto \
            --mode "debian" \
            --distribution "bookworm" \
            --architectures "amd64" \
            --linux-flavours "amd64" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --mirror-chroot-security "http://deb.debian.org/debian-security/" \
            --mirror-binary-security "http://deb.debian.org/debian-security/" \
            --security true \
            --updates true \
            --apt-indices false \
            --apt-recommends true \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootappend-live "boot=live components quiet splash live-config.username=user locales=${{ env.SYSTEM_LOCALE }} keyboard-layouts=${{ env.KEYBOARD_LAYOUT }} keyboard-variants=, keyboard-options=grp:alt_shift_toggle" \
            --binary-images "iso-hybrid" \
            --iso-application "${{ env.DISTRO_FULLNAME }}" \
            --iso-volume "${{ env.DISTRO_NAME }}" \
            --debian-installer "none" \
            --chroot-filesystem squashfs
          
          mkdir -p config/package-lists config/includes.chroot/etc/default config/includes.chroot/usr/share/backgrounds config/includes.chroot/etc/xdg/pcmanfm/LXDE config/hooks/normal
          
          {
            echo "linux-image-amd64"
            echo "live-boot"
            echo "live-config"
            echo "live-config-systemd"
            echo "user-setup"
            echo "sudo"
            echo "apt-utils"
            echo "ca-certificates"
            echo "curl"
            echo "wget"
            echo "xserver-xorg-video-all"
            echo "xserver-xorg-input-all"
            echo "dbus-x11"
            echo "task-lxde-desktop"
            echo "lightdm"
            echo "network-manager"
            echo "network-manager-gnome"
            echo "arc-theme"
            echo "papirus-icon-theme"
            echo "zram-tools"
            echo "locales"
            echo "fonts-noto-core"
            echo "fonts-kacst"
          } > config/package-lists/base.list.chroot
          
          wget -q -O config/includes.chroot/usr/share/backgrounds/wallpaper.jpg "${{ env.WALLPAPER_URL }}" || true
          echo "LANG=${{ env.SYSTEM_LOCALE }}" > config/includes.chroot/etc/default/locale
          printf '[*]\nwallpaper_mode=stretch\nwallpaper=/usr/share/backgrounds/wallpaper.jpg\ndesktop_bg=%s\n' '${{ env.BG_COLOR }}' > config/includes.chroot/etc/xdg/pcmanfm/LXDE/desktop-items-0.conf
          
          # إعداد الـ Hooks (بدون تغيير في منطق العمل)
          cat << 'EOF' > config/hooks/normal/0000-policy-rc.d.hook.chroot
          #!/bin/sh
          echo "exit 101" > /usr/sbin/policy-rc.d
          chmod +x /usr/sbin/policy-rc.d
          EOF
          chmod 755 config/hooks/normal/0000-policy-rc.d.hook.chroot

          cat << 'EOF' > config/hooks/normal/0010-prevent-interactive.hook.chroot
          #!/bin/sh
          echo 'lightdm shared/default-x-display-manager select lightdm' | debconf-set-selections
          EOF
          chmod 755 config/hooks/normal/0010-prevent-interactive.hook.chroot

          cat << 'EOF' > config/hooks/normal/0020-autologin.hook.chroot
          #!/bin/sh
          mkdir -p /etc/lightdm
          cat << CFG > /etc/lightdm/lightdm.conf
          [Seat:*]
          autologin-user=user
          autologin-user-timeout=0
          user-session=LXDE
          CFG
          EOF
          chmod 755 config/hooks/normal/0020-autologin.hook.chroot

          cat << 'EOF' > config/hooks/normal/0500-setup-system.hook.chroot
          #!/bin/sh
          set -e
          grep -qxF 'ar_SA.UTF-8 UTF-8' /etc/locale.gen || echo "ar_SA.UTF-8 UTF-8" >> /etc/locale.gen
          grep -qxF 'en_US.UTF-8 UTF-8' /etc/locale.gen || echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
          locale-gen || true
          for service in ModemManager bluetooth cups avahi-daemon; do
              if [ -f /lib/systemd/system/"$service".service ]; then
                  mkdir -p /etc/systemd/system/
                  ln -sf /dev/null /etc/systemd/system/"$service".service || true
              fi
          done
          EOF
          chmod 755 config/hooks/normal/0500-setup-system.hook.chroot

          cat << 'EOF' > config/hooks/normal/9999-cleanup.hook.chroot
          #!/bin/sh
          rm -f /usr/sbin/policy-rc.d
          apt-get clean
          rm -rf /var/cache/apt/archives/* /tmp/* /var/tmp/* /var/lib/apt/lists/*
          EOF
          chmod 755 config/hooks/normal/9999-cleanup.hook.chroot

          sudo chown -R root:root config/
          sudo env DEBIAN_FRONTEND=noninteractive PATH="$PATH" HOME="$HOME" lb build
          
          if [ -f live-image-amd64.hybrid.iso ]; then
            mkdir -p ../output
            cp live-image-amd64.hybrid.iso ../output/${{ env.DISTRO_NAME }}.iso
            sudo chmod 666 ../output/${{ env.DISTRO_NAME }}.iso
          else
            echo "ERROR: ISO was not generated!" && exit 1
          fi

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DISTRO_NAME }}-ISO
          path: output/
          retention-days: 7

