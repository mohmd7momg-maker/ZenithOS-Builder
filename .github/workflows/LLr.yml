name: Build Lightweight Arabic Live ISO

on:
  workflow_dispatch:
    inputs:
      distro_version:
        description: 'Version string (leave blank for YYYYMMDD)'
        required: false
        default: ''
  push:
    tags:
      - 'v*.*'

env:
  DISTRO_NAME: "MyLive"
  DISTRO_FULLNAME: "My Light Live"
  DEBIAN_FRONTEND: "noninteractive"
  SYSTEM_LOCALE: "ar_SA.UTF-8"
  KEYBOARD_LAYOUT: "ara,us"
  KEYBOARD_SWITCH: "grp:alt_shift_toggle"
  THEME_NAME: "Arc"
  ICON_THEME: "Papirus"
  FONT_NAME: "Noto Sans Arabic"
  FONT_SIZE: "11"
  WALLPAPER_URL: "https://raw.githubusercontent.com/GNOME/backgrounds/main/backgrounds/adwaita-d.jpg"
  BG_COLOR: "#2E3440"

jobs:
  build-iso:
    name: Build ISO
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set ISO version
        id: ver
        run: |
          if [[ -n "${{ github.event.inputs.distro_version }}" ]]; then
            VER="${{ github.event.inputs.distro_version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${GITHUB_REF#refs/tags/}"
            VER="${VER#v}"
          else
            VER="$(date +%Y%m%d)"
          fi
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "ISO will be named: ${{ env.DISTRO_NAME }}-${VER}.iso"

      - name: Cache host apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-cache-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            apt-cache-${{ runner.os }}-

      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends live-build

      - name: Build live system
        run: |
          set -e
          mkdir -p live-work && cd live-work
          lb config noauto \
            --distribution "bookworm" \
            --archive-areas "main contrib non-free" \
            --debian-installer "live" \
            --bootappend-live "boot=live components quiet splash zram.enabled=1 locales=${{ env.SYSTEM_LOCALE }} keyboard-layouts=${{ env.KEYBOARD_LAYOUT }}" \
            --binary-images "iso-hybrid" \
            --iso-application "${{ env.DISTRO_FULLNAME }}" \
            --iso-volume "${{ env.DISTRO_NAME }} ${{ steps.ver.outputs.version }}" \
            --linux-flavours "amd64" \
            --memtest "none" \
            --chroot-filesystem squashfs
          
          export MKSQUASHFS_OPTIONS="-comp xz -Xdict-size 100%"
          
          echo "task-lxde-desktop" > config/package-lists/base.list.chroot
          echo "network-manager" >> config/package-lists/base.list.chroot
          echo "network-manager-gnome" >> config/package-lists/base.list.chroot
          echo "arc-theme" >> config/package-lists/base.list.chroot
          echo "papirus-icon-theme" >> config/package-lists/base.list.chroot
          
          echo "zram-tools" >> config/package-lists/base.list.chroot
          echo "locales" >> config/package-lists/base.list.chroot
          echo "fonts-noto" >> config/package-lists/base.list.chroot
          echo "fonts-noto-arabic" >> config/package-lists/base.list.chroot
          echo "xarchiver" >> config/package-lists/base.list.chroot
          echo "zip" >> config/package-lists/base.list.chroot
          echo "unzip" >> config/package-lists/base.list.chroot
          echo "p7zip-full" >> config/package-lists/base.list.chroot
          echo "gvfs" >> config/package-lists/base.list.chroot
          mkdir -p config/includes.chroot/etc/{default,xdg/lxsession/LXDE,xdg/pcmanfm/LXDE,xdg/openbox,skel}
          mkdir -p config/includes.chroot/usr/share/backgrounds
          mkdir -p config/includes.chroot/etc/lightdm
          echo "Downloading wallpaper..."
          wget -q -O config/includes.chroot/usr/share/backgrounds/wallpaper.jpg "${{ env.WALLPAPER_URL }}" || true
          echo "LANG=${{ env.SYSTEM_LOCALE }}" > config/includes.chroot/etc/default/locale
          echo "LC_ALL=${{ env.SYSTEM_LOCALE }}" >> config/includes.chroot/etc/default/locale
          echo 'XKBMODEL="pc105"' > config/includes.chroot/etc/default/keyboard
          echo 'XKBLAYOUT="ara,us"' >> config/includes.chroot/etc/default/keyboard
          echo 'XKBVARIANT=""' >> config/includes.chroot/etc/default/keyboard
          echo 'XKBOPTIONS="grp:alt_shift_toggle"' >> config/includes.chroot/etc/default/keyboard
          echo 'BACKSPACE="guess"' >> config/includes.chroot/etc/default/keyboard
          echo "[*]" > config/includes.chroot/etc/xdg/pcmanfm/LXDE/desktop-items-0.conf
          echo "wallpaper_mode=stretch" >> config/includes.chroot/etc/xdg/pcmanfm/LXDE/desktop-items-0.conf
          echo "wallpaper=/usr/share/backgrounds/wallpaper.jpg" >> config/includes.chroot/etc/xdg/pcmanfm/LXDE/desktop-items-0.conf
          echo "desktop_bg=${{ env.BG_COLOR }}" >> config/includes.chroot/etc/xdg/pcmanfm/LXDE/desktop-items-0.conf
          echo "[Session]" > config/includes.chroot/etc/xdg/lxsession/LXDE/desktop.conf
          echo "window_manager=openbox" >> config/includes.chroot/etc/xdg/lxsession/LXDE/desktop.conf
          echo "disable_autostart=no" >> config/includes.chroot/etc/xdg/lxsession/LXDE/desktop.conf
          echo "" >> config/includes.chroot/etc/xdg/lxsession/LXDE/desktop.conf
          echo "[GTK]" >> config/includes.chroot/etc/xdg/lxsession/LXDE/desktop.conf
          echo "sGtk/ThemeName=${{ env.THEME_NAME }}" >> config/includes.chroot/etc/xdg/lxsession/LXDE/desktop.conf
          echo "sGtk/IconThemeName=${{ env.ICON_THEME }}" >> config/includes.chroot/etc/xdg/lxsession/LXDE/desktop.conf
          echo "sGtk/FontName=${{ env.FONT_NAME }} ${{ env.FONT_SIZE }}" >> config/includes.chroot/etc/xdg/lxsession/LXDE/desktop.conf
          echo '<?xml version="1.0" encoding="UTF-8"?>' > config/includes.chroot/etc/xdg/openbox/rc.xml
          echo '<openbox_config xmlns="http://openbox.org/3.4/rc">' >> config/includes.chroot/etc/xdg/openbox/rc.xml
          echo '  <theme>' >> config/includes.chroot/etc/xdg/openbox/rc.xml
          echo "    <name>${{ env.THEME_NAME }}</name>" >> config/includes.chroot/etc/xdg/openbox/rc.xml
          echo '    <titleLayout>NLIMC</titleLayout>' >> config/includes.chroot/etc/xdg/openbox/rc.xml
          echo '    <keepBorder>yes</keepBorder>' >> config/includes.chroot/etc/xdg/openbox/rc.xml
          echo '  </theme>' >> config/includes.chroot/etc/xdg/openbox/rc.xml
          echo '  <desktops>' >> config/includes.chroot/etc/xdg/openbox/rc.xml
          echo '    <number>2</number>' >> config/includes.chroot/etc/xdg/openbox/rc.xml
          echo '  </desktops>' >> config/includes.chroot/etc/xdg/openbox/rc.xml
          
          # تأمين نهاية ملف rc.xml لتجنب أي أخطاء تفسير
          echo '</openbox_config>' >> config/includes.chroot/etc/xdg/openbox/rc.xml
          
          echo '#!/bin/sh' > config/hooks/normal/0500-disable-services.hook.chroot
          echo 'systemctl disable --now ModemManager.service 2>/dev/null || true' >> config/hooks/normal/0500-disable-services.hook.chroot
          echo 'systemctl disable --now bluetooth.service 2>/dev/null || true' >> config/hooks/normal/0500-disable-services.hook.chroot
          echo 'systemctl disable --now cups.service 2>/dev/null || true' >> config/hooks/normal/0500-disable-services.hook.chroot
          echo 'systemctl disable --now avahi-daemon.service 2>/dev/null || true' >> config/hooks/normal/0500-disable-services.hook.chroot
          chmod +x config/hooks/normal/0500-disable-services.hook.chroot
          sudo lb build
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp live-image-amd64.hybrid.iso "$GITHUB_WORKSPACE/output/${{ env.DISTRO_NAME }}-${{ steps.ver.outputs.version }}.iso"

      - name: Generate checksum
        run: |
          cd "$GITHUB_WORKSPACE/output"
          sha256sum *.iso > ${{ env.DISTRO_NAME }}-${{ steps.ver.outputs.version }}.sha256
          cat ${{ env.DISTRO_NAME }}-${{ steps.ver.outputs.version }}.sha256

      - name: Upload artifact (no re-compression)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DISTRO_NAME }}-${{ steps.ver.outputs.version }}
          path: |
            output/*.iso
            output/*.sha256
          retention-days: 30
          compression-level: 0

      - name: Create release (on tags)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ env.DISTRO_FULLNAME }} ${{ steps.ver.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## ${{ env.DISTRO_FULLNAME }} v${{ steps.ver.outputs.version }}

            نظام حي خفيف جداً بالعربية.
            - سطح مكتب LXDE
            - استهلاك منخفض جداً للذاكرة
            - دعم كامل للغة العربية
            - بدون برامج ثقيلة (يمكن تثبيتها بسهولة)

            ### النسخ على USB
```bash
            sudo dd if=${{ env.DISTRO_NAME }}-${{ steps.ver.outputs.version }}.iso of=/dev/sdX bs=4M status=progress conv=fsync
            ```
files: |
output/*.iso
output/*.sha256
draft: false
prerelease: false
env:
GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
