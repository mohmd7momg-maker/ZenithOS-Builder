name: Build Lightweight Arabic Live ISO

on:
  workflow_dispatch:
  push:
    tags: ['v*.*']

env:
  DISTRO_NAME: "MyLive"
  DISTRO_FULLNAME: "My Light Live"
  SYSTEM_LOCALE: "ar_SA.UTF-8"
  KEYBOARD_LAYOUT: "ara,us"
  WALLPAPER_URL: "https://raw.githubusercontent.com/GNOME/backgrounds/main/backgrounds/adwaita-d.jpg"
  BG_COLOR: "#2E3440"

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up Disk Space & Kill Background Updates
        run: |
          sudo systemctl stop unattended-upgrades || true
          sudo killall apt apt-get || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          sudo apt-get clean

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            live-build \
            debian-keyring \
            debian-archive-keyring \
            curl gnupg wget xorriso \
            isolinux mtools \
            grub-efi-amd64-bin grub-efi-ia32-bin grub-pc-bin \
            squashfs-tools

      - name: Build System
        run: |
          set -e
          mkdir -p live-work && cd live-work
          sudo lb clean --purge || true

          lb config noauto \
            --mode "debian" \
            --distribution "bookworm" \
            --architectures "amd64" \
            --linux-flavours "amd64" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --mirror-chroot-security "http://security.debian.org/debian-security/" \
            --mirror-binary-security "http://security.debian.org/debian-security/" \
            --security true \
            --apt-indices false \
            --apt-recommends true \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootappend-live "boot=live components quiet splash live-config.username=user locales=${{ env.SYSTEM_LOCALE }} keyboard-layouts=${{ env.KEYBOARD_LAYOUT }} keyboard-variants=, keyboard-options=grp:alt_shift_toggle" \
            --binary-images "iso-hybrid" \
            --iso-application "${{ env.DISTRO_FULLNAME }}" \
            --iso-volume "${{ env.DISTRO_NAME }}" \
            --debian-installer "none" \
            --chroot-filesystem squashfs

          mkdir -p config/package-lists
          mkdir -p config/includes.chroot/etc/default
          mkdir -p config/includes.chroot/usr/share/backgrounds
          mkdir -p config/includes.chroot/etc/xdg/pcmanfm/LXDE
          mkdir -p config/hooks/normal

          # ── قائمة الحزم ────────────────────────────────────────────────────
          {
            echo "linux-image-amd64"
            echo "live-boot"
            echo "live-config"
            echo "live-config-systemd"
            echo "user-setup"
            echo "sudo"
            echo "apt-utils"
            echo "ca-certificates"
            echo "curl"
            echo "wget"
            echo "xserver-xorg-video-all"
            echo "xserver-xorg-input-all"
            echo "dbus-x11"
            echo "task-lxde-desktop"
            echo "lightdm"
            echo "network-manager"
            echo "network-manager-gnome"
            echo "arc-theme"
            echo "papirus-icon-theme"
            echo "zram-tools"
            echo "locales"
            echo "fonts-noto-core"
            echo "fonts-kacst"
          } > config/package-lists/base.list.chroot

          # ── الخلفية والإعدادات ─────────────────────────────────────────────
          wget -q -O config/includes.chroot/usr/share/backgrounds/wallpaper.jpg \
            "${{ env.WALLPAPER_URL }}" || true

          echo "LANG=${{ env.SYSTEM_LOCALE }}" \
            > config/includes.chroot/etc/default/locale

          # ✅ الإصلاح: printf بدل heredoc لتفادي [*] ككلمة YAML
          printf '%s\n' '[*]' 'wallpaper_mode=stretch' \
            'wallpaper=/usr/share/backgrounds/wallpaper.jpg' \
            'desktop_bg=#2E3440' \
            > config/includes.chroot/etc/xdg/pcmanfm/LXDE/desktop-items-0.conf

          # ── هوك 0: يمنع تشغيل الخدمات داخل الـ chroot ────────────────────
          cat > config/hooks/normal/0000-policy-rc.d.hook.chroot << 'EOF'
#!/bin/sh
echo "exit 101" > /usr/sbin/policy-rc.d
chmod +x /usr/sbin/policy-rc.d
EOF
          chmod 755 config/hooks/normal/0000-policy-rc.d.hook.chroot

          # ── هوك 1: منع التفاعل مع debconf ─────────────────────────────────
          cat > config/hooks/normal/0010-prevent-interactive.hook.chroot << 'EOF'
#!/bin/sh
echo 'lightdm shared/default-x-display-manager select lightdm' | debconf-set-selections
EOF
          chmod 755 config/hooks/normal/0010-prevent-interactive.hook.chroot

          # ── هوك 2: autologin بـ printf لتفادي heredoc المتداخل ───────────
          printf '%s\n' \
            '#!/bin/sh' \
            'mkdir -p /etc/lightdm' \
            'cat > /etc/lightdm/lightdm.conf << CFG' \
            '[Seat:*]' \
            'autologin-user=user' \
            'autologin-user-timeout=0' \
            'user-session=LXDE' \
            'CFG' \
            > config/hooks/normal/0020-autologin.hook.chroot
          chmod 755 config/hooks/normal/0020-autologin.hook.chroot

          # ── هوك 3: اللغة وتعطيل الخدمات غير الضرورية ─────────────────────
          cat > config/hooks/normal/0500-setup-system.hook.chroot << 'EOF'
#!/bin/sh
set -e
if [ -f /etc/locale.gen ]; then
    grep -qxF 'ar_SA.UTF-8 UTF-8' /etc/locale.gen || echo "ar_SA.UTF-8 UTF-8" >> /etc/locale.gen
    grep -qxF 'en_US.UTF-8 UTF-8' /etc/locale.gen || echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
    locale-gen || true
fi
for service in ModemManager bluetooth cups avahi-daemon; do
    if [ -f /lib/systemd/system/"$service".service ]; then
        mkdir -p /etc/systemd/system/
        ln -sf /dev/null /etc/systemd/system/"$service".service || true
    fi
done
EOF
          chmod 755 config/hooks/normal/0500-setup-system.hook.chroot

          # ── هوك 4: إعداد ZRAM عبر zram-tools ────────────────────────────
          cat > config/hooks/normal/0510-zram.hook.chroot << 'EOF'
#!/bin/sh
if [ -f /etc/default/zramswap ]; then
    sed -i 's/^#\?ALGO=.*/ALGO=lz4/'      /etc/default/zramswap
    sed -i 's/^#\?PERCENT=.*/PERCENT=50/' /etc/default/zramswap
fi
EOF
          chmod 755 config/hooks/normal/0510-zram.hook.chroot

          # ── هوك 5: تنظيف الكاش قبل ضغط squashfs ──────────────────────────
          cat > config/hooks/normal/9999-cleanup.hook.chroot << 'EOF'
#!/bin/sh
rm -f /usr/sbin/policy-rc.d
apt-get clean
rm -rf /var/cache/apt/archives/* /tmp/* /var/tmp/* /var/lib/apt/lists/*
EOF
          chmod 755 config/hooks/normal/9999-cleanup.hook.chroot

          # ── تعديل ملكية كامل config/ لـ root قبل lb build ─────────────────
          sudo chown -R root:root config/

          sudo env \
            DEBIAN_FRONTEND=noninteractive \
            PATH="$PATH" \
            HOME="$HOME" \
            lb build

          if [ -f live-image-amd64.hybrid.iso ]; then
            mkdir -p ../output
            cp live-image-amd64.hybrid.iso ../output/${{ env.DISTRO_NAME }}.iso
            sudo chmod 666 ../output/${{ env.DISTRO_NAME }}.iso
          else
            echo "ERROR: ISO was not generated!" && exit 1
          fi

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DISTRO_NAME }}-ISO
          path: output/
          retention-days: 7
