# ... (بداية الملف كما هي) ...

      # ── 2. تثبيت الأدوات اللازمة على المضيف ─────────────────────────────
      - name: Install Host Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends live-build

      # ── 3. بناء التوزيعة باستخدام live-build ─────────────────────────────
      - name: Configure and Build Live System
        run: |
          # إنشاء مجلد العمل
          mkdir -p ./live-build-work && cd ./live-build-work

          # ---- إعدادات live-build الأساسية ----
          lb config noauto \
            --distribution "buster" \
            --archive-areas "main contrib non-free" \
            --debian-installer "live" \
            --bootappend-live "boot=live components quiet splash zram.enabled=1" \ # <-- تفعيل zram
            --binary-images "iso-hybrid" \
            --iso-application "${{ env.DISTRO_NAME }}" \
            --iso-volume "${{ env.DISTRO_NAME }} ${{ steps.ver.outputs.version }}" \
            --linux-flavours "amd64" \
            --memtest "none"

          # ---- قوائم الحزم (بدون أي أدوات تور) ----
          # سطح مكتب LXDE خفيف جداً
          echo "task-lxde-desktop" > config/package-lists/desktop.list.chroot # <-- LXDE بدلاً من Xfce
          # إدارة الشبكة
          echo "network-manager" >> config/package-lists/network.list.chroot
          # متصفح إنترنت أساسي
          echo "firefox-esr" >> config/package-lists/apps.list.chroot
          # أدوات نظام مفيدة
          echo "lxterminal" >> config/package-lists/apps.list.chroot # <-- استخدام LXTerminal
          echo "pcmanfm" >> config/package-lists/apps.list.chroot
          echo "leafpad" >> config/package-lists/apps.list.chroot
          echo "gvfs" >> config/package-lists/apps.list.chroot
          # أدوات ضغط وفك ضغط (خفيفة)
          echo "xarchiver" >> config/package-lists/apps.list.chroot # <-- xarchiver بدلاً من file-roller
          echo "zip unzip p7zip-full" >> config/package-lists/apps.list.chroot
          # أدوات تحسين الذاكرة
          echo "zram-tools" >> config/package-lists/apps.list.chroot # <-- لحزمة zram

          # ---- تعطيل الخدمات غير الضرورية لتوفير الذاكرة ---- 
          cat > config/hooks/normal/0500-disable-services.hook.chroot << 'EOF'
          #!/bin/sh
          echo "Disabling unnecessary services..."
          systemctl disable --now ModemManager.service 2>/dev/null || true
          systemctl disable --now bluetooth.service 2>/dev/null || true
          systemctl disable --now cups.service 2>/dev/null || true
          systemctl disable --now avahi-daemon.service 2>/dev/null || true
          echo "Services disabled."
          EOF
          chmod +x config/hooks/normal/0500-disable-services.hook.chroot

          # ---- بدء عملية البناء ----
          sudo lb build

          # ... (باقي الخطوات كما هي) ...
