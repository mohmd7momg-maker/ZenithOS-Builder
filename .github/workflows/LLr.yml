name: Build Lightweight Arabic Live ISO

on:
  workflow_dispatch:
  push:
    tags: ['v*.*']

env:
  DISTRO_NAME: "MyLive"
  DISTRO_FULLNAME: "My Light Live"
  SYSTEM_LOCALE: "ar_SA.UTF-8"
  KEYBOARD_LAYOUT: "ara,us"
  WALLPAPER_URL: "https://raw.githubusercontent.com/GNOME/backgrounds/main/backgrounds/adwaita-d.jpg"
  BG_COLOR: "#2E3440"

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean

      - name: Install Dependencies and Update Keyring for Bookworm
        run: |
          # تثبيت الأدوات الأساسية
          sudo apt-get update -qq
          sudo apt-get install -y live-build debian-archive-keyring curl gnupg wget xorriso isolinux mtools grub-efi-amd64-bin grub-pc-bin squashfs-tools

          # تنزيل وتثبيت أحدث حزمة مفاتيح Debian Bookworm (رسمية)
          wget -q "http://ftp.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2023.3+deb12u2_all.deb"
          sudo dpkg -i debian-archive-keyring_2023.3+deb12u2_all.deb
          rm debian-archive-keyring_2023.3+deb12u2_all.deb

          # تحديث قاعدة بيانات الحزم للتأكد من التعرف على المفاتيح الجديدة
          sudo apt-get update -qq || true

      - name: Build System
        run: |
          set -e
          mkdir -p live-work && cd live-work
          sudo lb clean --purge || true

          lb config noauto \
            --mode "debian" \
            --distribution "bookworm" \
            --architectures "amd64" \
            --linux-flavours "amd64" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --mirror-chroot-security "http://deb.debian.org/debian-security/" \
            --mirror-binary-security "http://deb.debian.org/debian-security/" \
            --security true \
            --apt-recommends true \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootappend-live "boot=live components quiet splash locales=${{ env.SYSTEM_LOCALE }} keyboard-layouts=${{ env.KEYBOARD_LAYOUT }} keyboard-options=grp:alt_shift_toggle" \
            --binary-images "iso-hybrid" \
            --iso-application "${{ env.DISTRO_FULLNAME }}" \
            --iso-volume "${{ env.DISTRO_NAME }}" \
            --debian-installer "none" \
            --chroot-filesystem squashfs

          mkdir -p config/package-lists config/includes.chroot/etc/default config/includes.chroot/usr/share/backgrounds config/includes.chroot/etc/xdg/pcmanfm/LXDE config/hooks/normal

          {
            echo "linux-image-amd64"
            echo "live-boot"
            echo "live-config"
            echo "live-config-systemd"
            echo "sudo"
            echo "firmware-linux"
            echo "ca-certificates"
            echo "curl"
            echo "wget"
            echo "xserver-xorg-video-all"
            echo "xserver-xorg-input-all"
            echo "dbus-x11"
            echo "task-lxde-desktop"
            echo "lightdm"
            echo "network-manager"
            echo "network-manager-gnome"
            echo "arc-theme"
            echo "papirus-icon-theme"
            echo "zram-tools"
            echo "locales"
            echo "fonts-noto-core"
            echo "fonts-kacst"
          } > config/package-lists/base.list.chroot

          wget -q -O config/includes.chroot/usr/share/backgrounds/wallpaper.jpg "${{ env.WALLPAPER_URL }}" || true
          echo "LANG=${{ env.SYSTEM_LOCALE }}" > config/includes.chroot/etc/default/locale
          printf '[*]\nwallpaper_mode=stretch\nwallpaper=/usr/share/backgrounds/wallpaper.jpg\ndesktop_bg=%s\n' "${{ env.BG_COLOR }}" > config/includes.chroot/etc/xdg/pcmanfm/LXDE/desktop-items-0.conf

          # كتابة customize.sh بأمان تام (باستخدام echo فقط)
          echo '#!/bin/bash' > customize.sh
          echo 'set -e' >> customize.sh
          echo '' >> customize.sh
          echo 'echo "exit 101" > /usr/sbin/policy-rc.d' >> customize.sh
          echo 'chmod +x /usr/sbin/policy-rc.d' >> customize.sh
          echo '' >> customize.sh
          echo 'echo "lightdm shared/default-x-display-manager select lightdm" | debconf-set-selections' >> customize.sh
          echo '' >> customize.sh
          echo 'mkdir -p /etc/lightdm' >> customize.sh
          echo 'printf "[Seat:*]\nautologin-user=user\nautologin-user-timeout=0\nuser-session=LXDE\n" > /etc/lightdm/lightdm.conf' >> customize.sh
          echo '' >> customize.sh
          echo 'grep -qxF "ar_SA.UTF-8 UTF-8" /etc/locale.gen || echo "ar_SA.UTF-8 UTF-8" >> /etc/locale.gen' >> customize.sh
          echo 'grep -qxF "en_US.UTF-8 UTF-8" /etc/locale.gen || echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen' >> customize.sh
          echo 'locale-gen || true' >> customize.sh
          echo '' >> customize.sh
          echo 'for service in ModemManager bluetooth cups avahi-daemon; do' >> customize.sh
          echo '    if [ -f /lib/systemd/system/"$service".service ]; then' >> customize.sh
          echo '        mkdir -p /etc/systemd/system/' >> customize.sh
          echo '        ln -sf /dev/null /etc/systemd/system/"$service".service || true' >> customize.sh
          echo '    fi' >> customize.sh
          echo 'done' >> customize.sh
          echo '' >> customize.sh
          echo 'rm -f /usr/sbin/policy-rc.d' >> customize.sh
          echo 'apt-get clean' >> customize.sh
          echo 'rm -rf /var/cache/apt/archives/* /tmp/* /var/tmp/* /var/lib/apt/lists/*' >> customize.sh

          chmod +x customize.sh
          sudo cp customize.sh config/hooks/normal/0500-customize.hook.chroot
          sudo chmod +x config/hooks/normal/0500-customize.hook.chroot

          sudo env DEBIAN_FRONTEND=noninteractive PATH="$PATH" HOME="$HOME" lb build

          if [ -f live-image-amd64.hybrid.iso ]; then
            mkdir -p ../output
            cp live-image-amd64.hybrid.iso ../output/${{ env.DISTRO_NAME }}.iso
          else
            echo "ERROR: ISO was not generated!" && exit 1
          fi

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DISTRO_NAME }}-ISO
          path: output/
          retention-days: 7
          compression-level: 0

      - name: Create Release (on tags)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ env.DISTRO_FULLNAME }} ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: output/${{ env.DISTRO_NAME }}.iso
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
