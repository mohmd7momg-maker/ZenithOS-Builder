name: UPL-OS Final (Production Ready)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upl-build.yml'

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Maximize Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker system prune -af || true

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/pacman-cache
          key: pacman-${{ runner.os }}-${{ hashFiles('.github/workflows/upl-build.yml') }}
          restore-keys: |
            pacman-${{ runner.os }}-

      - name: Create build script
        run: |
          cat > ${{ github.workspace }}/build.sh <<'BUILD_SCRIPT'
          #!/usr/bin/env bash
          set -e
          echo "بدء build.sh ..."

          pacman-key --init
          pacman-key --populate archlinux
          pacman-key --keyserver keyserver.ubuntu.com --recv-keys 882DCFE48E2051D48E2562ABF3B607488DB35A47
          pacman-key --lsign-key 882DCFE48E2051D48E2562ABF3B607488DB35A47

          mkdir -p /etc/pacman.d
          echo 'Server = https://mirror.cachyos.org/repo/$arch/$repo' > /etc/pacman.d/cachyos-mirrorlist

          cat >> /etc/pacman.conf <<'EOF'
          [cachyos]
          Include = /etc/pacman.d/cachyos-mirrorlist
          EOF

          pacman -Syu --needed --noconfirm archiso git curl reflector archlinux-keyring
          pacman -S --noconfirm cachyos-keyring 2>/dev/null || echo "[!] cachyos-keyring غير متوفر في المضيف"
          reflector --latest 10 --protocol https --country "United States,Germany,France" --sort rate --save /etc/pacman.d/mirrorlist

          WORKDIR="/workspace/upl-iso-build"
          PROFILE_DIR="$WORKDIR/archiso"
          mkdir -p "$WORKDIR"
          rm -rf "$PROFILE_DIR"
          mkdir -p "$PROFILE_DIR"
          cp -r /usr/share/archiso/configs/releng/* "$PROFILE_DIR"
          cd "$PROFILE_DIR"

          sed -i '/^linux$/d; /^linux-headers$/d' packages.x86_64

          for cfg in grub/grub.cfg syslinux/archiso_sys-linux.cfg syslinux/archiso_sys64.cfg; do
              [ -f "$cfg" ] && sed -i 's/\bquiet\b/quiet lsm=landlock,lockdown,yama,apparmor,bpf nowatchdog/' "$cfg" || true
          done

          cat > pacman.conf <<'EOF'
          [options]
          HoldPkg     = pacman glibc
          Architecture = x86_64
          SigLevel    = Never
          LocalFileSigLevel = Optional
          CacheDir    = /workspace/pacman-cache

          [cachyos]
          Server = https://mirror.cachyos.org/repo/$arch/$repo

          [core]
          Include = /etc/pacman.d/mirrorlist
          [extra]
          Include = /etc/pacman.d/mirrorlist
          [multilib]
          Include = /etc/pacman.d/mirrorlist
          EOF

          mkdir -p airootfs/etc/pacman.d
          echo 'Server = https://mirror.cachyos.org/repo/$arch/$repo' > airootfs/etc/pacman.d/cachyos-mirrorlist

          # ---- قائمة الحزم (تمت إزالة uksmd و libva-mesa-driver و libva-intel-driver) ----
          cat >> packages.x86_64 <<'EOF'
          cachyos-keyring
          cachyos-mirrorlist
          cachyos-settings
          cachyos-hooks
          cachy-chroot
          pciutils
          kdesu
          intel-ucode
          amd-ucode
          dkms
          grub
          efibootmgr
          os-prober
          mtools
          dosfstools
          cryptsetup
          linux-cachyos-lts
          linux-cachyos-lts-headers
          linux-firmware
          sof-firmware
          alsa-firmware
          alsa-ucm-conf
          plasma-desktop
          sddm
          plasma-nm
          plasma-systemmonitor
          konsole
          dolphin
          okular
          gwenview
          spectacle
          kate
          flatpak
          xdg-desktop-portal
          xdg-desktop-portal-kde
          zram-generator
          ananicy-cpp
          power-profiles-daemon
          apparmor
          ufw
          btrfs-progs
          timeshift
          grub-btrfs
          inotify-tools
          pipewire
          pipewire-pulse
          pipewire-alsa
          pipewire-jack
          wireplumber
          pavucontrol-qt
          gst-plugin-pipewire
          networkmanager
          network-manager-applet
          mesa
          vulkan-intel
          vulkan-radeon
          intel-media-driver
          htop
          fastfetch
          git
          curl
          wget
          reflector
          sudo
          ntfs-3g
          exfatprogs
          f2fs-tools
          cachyos-calamares
          noto-fonts
          ttf-dejavu
          ttf-liberation
          papirus-icon-theme
          breeze-icons
          firefox
          EOF

          mkdir -p airootfs/root
          cat > airootfs/root/customize_airootfs.sh <<'CUSTOMIZE'
          #!/bin/bash
          id -u arch &>/dev/null || useradd -m -G wheel,audio,video,network,storage -s /bin/bash arch
          echo "arch:arch" | chpasswd
          echo '%wheel ALL=(ALL:ALL) NOPASSWD: ALL' > /etc/sudoers.d/wheel-nopasswd
          chmod 440 /etc/sudoers.d/wheel-nopasswd
          mkdir -p /etc/polkit-1/rules.d
          cat > /etc/polkit-1/rules.d/49-calamares.rules <<'POLKIT'
          polkit.addRule(function(action, subject) {
              if (action.id === "org.freedesktop.policykit.exec" &&
                  action.lookup("program") === "/usr/bin/cachyos-calamares" &&
                  subject.isInGroup("wheel")) {
                  return polkit.Result.YES;
              }
          });
          POLKIT
          CUSTOMIZE
          chmod +x airootfs/root/customize_airootfs.sh

          mkdir -p airootfs/etc/skel
          cat > airootfs/etc/skel/.bashrc <<'BASHRC'
          [[ $- != *i* ]] && return
          PS1='[\u@\h \W]\$ '
          alias ls='ls --color=auto'
          alias ll='ls -lah'
          export EDITOR=nano
          BASHRC
          cat > airootfs/etc/skel/.bash_profile <<'BASHPROF'
          [[ -f ~/.bashrc ]] && . ~/.bashrc
          BASHPROF

          mkdir -p airootfs/etc/modprobe.d
          cat > airootfs/etc/modprobe.d/nvidia-power.conf <<'NVPOWER'
          options nvidia NVreg_DynamicPowerManagement=0x02
          options nvidia NVreg_UsePageAttributeTable=1
          NVPOWER

          mkdir -p airootfs/etc/sysctl.d
          cat > airootfs/etc/sysctl.d/99-upl-performance.conf <<'EOF'
          vm.swappiness=80
          vm.vfs_cache_pressure=50
          vm.dirty_ratio=10
          vm.dirty_background_ratio=5
          vm.dirty_expire_centisecs=3000
          vm.dirty_writeback_centisecs=500
          vm.page-cluster=0
          vm.min_free_kbytes=65536
          kernel.kptr_restrict=2
          kernel.unprivileged_bpf_disabled=1
          kernel.yama.ptrace_scope=1
          kernel.randomize_va_space=2
          kernel.nmi_watchdog=0
          net.core.bpf_jit_harden=2
          fs.file-max=2097152
          net.core.default_qdisc=cake
          net.ipv4.tcp_congestion_control=bbr
          net.ipv4.tcp_fastopen=3
          net.ipv4.tcp_syncookies=1
          net.ipv4.conf.all.rp_filter=1
          net.ipv4.conf.default.rp_filter=1
          EOF

          mkdir -p airootfs/etc/modules-load.d
          echo "tcp_bbr" > airootfs/etc/modules-load.d/bbr.conf

          mkdir -p airootfs/etc/systemd/zram-generator.conf.d
          cat > airootfs/etc/systemd/zram-generator.conf.d/zram.conf <<'EOF'
          [zram0]
          zram-size = min(ram / 2, 4096)
          compression-algorithm = zstd
          swap-priority = 100
          EOF

          mkdir -p airootfs/etc/systemd/oomd.conf.d
          cat > airootfs/etc/systemd/oomd.conf.d/99-upl.conf <<'EOF'
          [OOM]
          DefaultMemoryPressureDurationSec=20s
          SwapUsedLimit=90%
          DefaultMemoryPressureLimit=60%
          EOF

          mkdir -p airootfs/etc/udev/rules.d
          cat > airootfs/etc/udev/rules.d/60-ioschedulers.rules <<'UEOF'
          ACTION=="add|change", KERNEL=="sd*[!0-9]|sr*", ATTR{queue/rotational}=="0", ATTR{queue/scheduler}="mq-deadline"
          ACTION=="add|change", KERNEL=="sd*[!0-9]|sr*", ATTR{queue/rotational}=="1", ATTR{queue/scheduler}="bfq"
          ACTION=="add|change", KERNEL=="nvme*[!0-9]", ATTR{queue/scheduler}="none"
          UEOF

          mkdir -p airootfs/etc/systemd/journald.conf.d
          cat > airootfs/etc/systemd/journald.conf.d/limit-size.conf <<'JEOF'
          [Journal]
          SystemMaxUse=50M
          RuntimeMaxUse=50M
          JEOF

          mkdir -p airootfs/etc/systemd/system.conf.d
          cat > airootfs/etc/systemd/system.conf.d/startup-timeout.conf <<'SEOF'
          [Manager]
          DefaultTimeoutStartSec=10s
          DefaultTimeoutStopSec=10s
          SEOF

          mkdir -p airootfs/etc/sddm.conf.d
          cat > airootfs/etc/sddm.conf.d/kde_settings.conf <<'EOF'
          [Autologin]
          User=arch
          Session=plasma
          [General]
          DisplayServer=wayland
          [Theme]
          Current=breeze
          EOF

          enable_service() {
              local service_name="$1"
              local target_wants="$2"
              mkdir -p "airootfs/etc/systemd/system/${target_wants}.wants"
              ln -sf "/usr/lib/systemd/system/${service_name}" "airootfs/etc/systemd/system/${target_wants}.wants/${service_name}"
          }
          enable_service sddm.service graphical.target
          enable_service NetworkManager.service multi-user.target
          enable_service ufw.service multi-user.target
          enable_service apparmor.service multi-user.target
          enable_service ananicy-cpp.service multi-user.target
          enable_service power-profiles-daemon.service multi-user.target
          enable_service systemd-oomd.service multi-user.target
          enable_service fstrim.timer timers.target

          mkdir -p airootfs/etc/xdg/autostart
          cat > airootfs/etc/xdg/autostart/calamares.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Install System
          Exec=kdesu cachyos-calamares
          Icon=system-software-install
          Categories=System;
          X-GNOME-Autostart-enabled=true
          X-KDE-autostart-after=panel
          NoDisplay=false
          EOF

          mkdir -p airootfs/usr/local/bin
          cat > airootfs/usr/local/bin/upl-postinstall.sh <<'POST'
          #!/bin/bash
          set -e

          cp /usr/local/share/upl/pacman.conf /etc/pacman.conf

          pacman-key --init 2>/dev/null || true
          pacman-key --populate cachyos archlinux 2>/dev/null || true

          systemctl enable apparmor ufw power-profiles-daemon 2>/dev/null || true
          aa-complain /etc/apparmor.d/* 2>/dev/null || true

          ufw --force reset 2>/dev/null || true
          ufw default deny incoming
          ufw default allow outgoing
          ufw limit 22/tcp
          ufw --force enable

          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo 2>/dev/null || true

          if lspci | grep -qi nvidia; then
              pacman -S --noconfirm nvidia-dkms nvidia-utils lib32-nvidia-utils
              mkdir -p /etc/mkinitcpio.conf.d
              cat > /etc/mkinitcpio.conf.d/nvidia.conf <<'NVIDIACONF'
          MODULES=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)
          NVIDIACONF
              mkinitcpio -P
          fi

          if [ -f /etc/default/grub ]; then
              if ! grep -q "nowatchdog" /etc/default/grub; then
                  sed -i 's/^\(GRUB_CMDLINE_LINUX_DEFAULT="\)/\1nowatchdog lsm=landlock,lockdown,yama,apparmor,bpf /' /etc/default/grub
              fi
              if ! grep -q "GRUB_DISABLE_OS_PROBER=false" /etc/default/grub; then
                  echo "GRUB_DISABLE_OS_PROBER=false" >> /etc/default/grub
              fi
              grub-mkconfig -o /boot/grub/grub.cfg 2>/dev/null || true
          fi

          if command -v timeshift &>/dev/null && [ "$(findmnt -n -o FSTYPE /)" = "btrfs" ]; then
              timeshift --create --comments "لقطة أولية" --tags D 2>/dev/null || true
          fi

          echo "[✔] اكتمل الإعداد اللاحق للتثبيت"
          POST
          chmod +x airootfs/usr/local/bin/upl-postinstall.sh

          mkdir -p airootfs/etc/calamares/modules
          cat > airootfs/etc/calamares/modules/shellprocess.conf <<'CALEOF'
          dontChroot: false
          timeout: 600
          script:
              - "/usr/local/bin/upl-postinstall.sh"
          CALEOF

          cat > airootfs/etc/calamares/modules/bootloader.conf <<'CALBOOT'
          efiBootLoader: "grub"
          grubInstall: "grub-install"
          grubMkconfig: "grub-mkconfig"
          grubCfg: "/boot/grub/grub.cfg"
          grubProbe: "grub-probe"
          efiDirectory: "/boot/efi"
          CALBOOT

          cat > airootfs/etc/calamares/modules/networkcfg.conf <<'CALNET'
          backend: networkmanager
          CALNET

          cat > airootfs/etc/calamares/modules/users.conf <<'CALUSERS'
          defaultGroups:
              - name: wheel
                must_exist: false
                state: true
              - name: audio
                must_exist: false
                state: true
              - name: video
                must_exist: false
                state: true
              - name: storage
                must_exist: false
                state: true
          autologinGroup: autologin
          doAutologin: false
          sudoersGroup: wheel
          setRootPassword: false
          doReusePassword: false
          passwordRequirements:
              minLength: 6
          CALUSERS

          cat > airootfs/etc/calamares/settings.conf <<'CALSET'
          modules-search: [ local, /usr/lib/calamares/modules ]

          sequence:
          - show:
            - welcome
            - locale
            - keyboard
            - partition
            - users
            - summary
          - exec:
            - partition
            - mount
            - unpackfs
            - machineid
            - fstab
            - locale
            - keyboard
            - localecfg
            - users
            - networkcfg
            - hwclock
            - bootloader
            - shellprocess
            - umount
          - show:
            - finished

          branding: default
          prompt-install: true
          dont-chroot: false
          disable-cancel: false
          quit-at-end: false
          CALSET

          cat > airootfs/etc/calamares/modules/mount.conf <<'CALMOUNT'
          btrfsSubvolumes:
              - mountPoint: /
                subvolName: /@
              - mountPoint: /home
                subvolName: /@home
              - mountPoint: /var/cache
                subvolName: /@cache
              - mountPoint: /var/log
                subvolName: /@log
          efiMountPoint: /boot/efi
          CALMOUNT

          cat > airootfs/etc/calamares/modules/partition.conf <<'CALPART'
          defaultFileSystemType: "btrfs"
          availableFileSystemTypes: ["ext4","btrfs","xfs","f2fs","swap"]
          enableLuksAutomatedPartitioning: true
          allowManualPartitioning: true
          initialPartitioningChoice: "erase"
          efi:
              mountPoint: "/boot/efi"
              recommendedSize: 512MiB
              minimumSize: 256MiB
          CALPART

          mkdir -p airootfs/usr/local/share/upl
          grep -v "^SigLevel\|^CacheDir" pacman.conf > /tmp/pacman_clean.conf
          echo "SigLevel    = Required DatabaseOptional" >> /tmp/pacman_clean.conf
          cp /tmp/pacman_clean.conf airootfs/usr/local/share/upl/pacman.conf

          if grep -q "^airootfs_image_tool_options=" profiledef.sh; then
              sed -i 's|^airootfs_image_tool_options=.*|airootfs_image_tool_options="-comp zstd -Xcompression-level 3"|' profiledef.sh
          elif grep -q "^squashfs_options=" profiledef.sh; then
              sed -i 's|^squashfs_options=.*|squashfs_options="-comp zstd -Xcompression-level 3"|' profiledef.sh
          else
              echo 'airootfs_image_tool_options="-comp zstd -Xcompression-level 3"' >> profiledef.sh
          fi

          echo "بدء mkarchiso..."
          mkarchiso -v -w "$WORKDIR/archiso-tmp" -o "$WORKDIR/out" "$PROFILE_DIR"
          echo "انتهى mkarchiso"

          rm -rf "$WORKDIR/archiso-tmp"
          [ $EUID -eq 0 ] && chown -R 1000:1000 "$WORKDIR/out" 2>/dev/null || true

          ISO_FILE=$(ls -t "$WORKDIR/out"/*.iso 2>/dev/null | head -1)
          if [ -n "$ISO_FILE" ]; then
              echo "✅ تم إنشاء ISO: $ISO_FILE"
          else
              echo "❌ فشل: لم يتم العثور على ملف ISO"
              exit 1
          fi
          BUILD_SCRIPT

      - name: Ensure build script is valid
        run: |
          test -s ${{ github.workspace }}/build.sh || { echo "build.sh missing!"; exit 1; }
          chmod +x ${{ github.workspace }}/build.sh

      - name: Run build inside container
        run: |
          mkdir -p ${{ github.workspace }}/pacman-cache
          docker run --rm --privileged \
            -e HOME=/workspace \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            archlinux:latest \
            /workspace/build.sh

      - name: Post-build cleanup permissions for Actions Cache
        run: |
          sudo chown -R $(whoami) ${{ github.workspace }}/pacman-cache || true

      - name: Verify ISO creation
        run: |
          ls -la ${{ github.workspace }}/upl-iso-build/out/
          test -f ${{ github.workspace }}/upl-iso-build/out/*.iso || { echo "ISO not found!"; exit 1; }

      - name: Generate Checksums
        run: |
          sudo chown -R $(whoami) ${{ github.workspace }}/upl-iso-build/out
          cd ${{ github.workspace }}/upl-iso-build/out
          sha256sum *.iso > checksums.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UPL-OS-Final-ISO
          path: |
            ${{ github.workspace }}/upl-iso-build/out/*.iso
            ${{ github.workspace }}/upl-iso-build/out/checksums.txt
