name: QamarOS 4.4.6 FINAL (Polished Production Initramfs)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin \
            grub-common mtools wget cpio util-linux busybox-static

      - name: Build rootfs
        run: |
          wget -q -O rootfs.tar.gz \
            https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-minirootfs-3.20.0-x86_64.tar.gz
          mkdir rootfs
          sudo tar xzf rootfs.tar.gz -C rootfs

      - name: Build squashfs
        run: |
          sudo mksquashfs rootfs rootfs.sqfs \
            -comp zstd -Xcompression-level 1 \
            -b 256K -processors $(nproc) \
            -noappend

      - name: Prepare ISO
        run: |
          mkdir -p iso/boot/grub iso/EFI/BOOT
          sudo apt-get install -y linux-image-generic
          cp /boot/vmlinuz-* iso/boot/vmlinuz
          cp rootfs.sqfs iso/rootfs.sqfs

      - name: Create initramfs (Hardened + Clean mounts)
        run: |
          mkdir -p initramfs/bin initramfs/proc initramfs/sys initramfs/dev initramfs/mnt initramfs/newroot

          cp "$(which busybox)" initramfs/bin/busybox

          cd initramfs

          for cmd in sh mount cat ls mkdir awk grep sleep umount chroot; do
            ln -s busybox bin/$cmd
          done

          cat > init << 'EOF'
#!/bin/busybox sh

mount -t proc proc /proc
mount -t sysfs sys /sys
mount -t devtmpfs dev /dev

echo "[QamarOS 4.4.6] Booting..."

ROOTFS=""

# -------------------------
# (1) mounted ISO scan
# -------------------------
while IFS= read -r line; do
    mp=$(echo "$line" | awk '{print $2}')
    if [ -f "$mp/rootfs.sqfs" ]; then
        ROOTFS="$mp/rootfs.sqfs"
        ISO_MNT="$mp"
        break
    fi
done < /proc/mounts

# -------------------------
# (2) initramfs root fallback
# -------------------------
[ -z "$ROOTFS" ] && [ -f /rootfs.sqfs ] && ROOTFS="/rootfs.sqfs"

# -------------------------
# (3) block device fallback
# -------------------------
if [ -z "$ROOTFS" ]; then
    for dev in /dev/sr0 /dev/sr1 /dev/sda /dev/sdb; do
        [ -b "$dev" ] || continue
        mount -t iso9660 "$dev" /mnt 2>/dev/null && \
        [ -f /mnt/rootfs.sqfs ] && ROOTFS="/mnt/rootfs.sqfs" && ISO_MNT="/mnt" && break
    done
fi

# -------------------------
# validation
# -------------------------
if [ -z "$ROOTFS" ]; then
    echo "FATAL: rootfs.sqfs not found"
    cat /proc/mounts
    exec /bin/sh
fi

echo "[QamarOS] Found rootfs: $ROOTFS"

mkdir -p /newroot

mount -t squashfs "$ROOTFS" /newroot 2>/dev/null || {
    echo "Squashfs failed, trying loop fallback..."
    mount -o loop "$ROOTFS" /newroot
}

# -------------------------
# OPTIONAL CLEANUP (your improvement)
# -------------------------
umount /mnt 2>/dev/null

# -------------------------
# safe system cleanup
# -------------------------
umount -l /proc 2>/dev/null
umount -l /sys 2>/dev/null
umount -l /dev 2>/dev/null

echo "[QamarOS] Switching root..."

# -------------------------
# robust init fallback
# -------------------------
exec chroot /newroot /sbin/init 2>/dev/null || \
exec chroot /newroot /bin/busybox init
EOF

          chmod +x init

          find . | cpio -o -H newc | gzip > ../iso/boot/initramfs
          cd ..

      - name: GRUB config
        run: |
          cat > grub.cfg << 'EOF'
set timeout=2
set default=0

menuentry "QamarOS 4.4.6 Stable" {
    linux /boot/vmlinuz root=LABEL=QAMAR_OS
    initrd /boot/initramfs
}
EOF

      - name: Build bootloaders
        run: |
          grub-mkstandalone --format=x86_64-efi \
            --output=iso/EFI/BOOT/BOOTX64.EFI \
            "boot/grub/grub.cfg=grub.cfg"

          grub-mkstandalone --format=i386-pc \
            --output=iso/boot/grub/eltorito.img \
            "boot/grub/grub.cfg=grub.cfg"

          cp grub.cfg iso/boot/grub/

      - name: Build ISO
        run: |
          xorriso -as mkisofs \
            -iso-level 3 \
            -volid "QAMAR_OS" \
            -eltorito-boot boot/grub/eltorito.img \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -eltorito-alt-boot \
            -e EFI/BOOT/BOOTX64.EFI \
            -no-emul-boot \
            -isohybrid-gpt-basdat \
            -output QamarOS.iso iso

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QamarOS-4.4.6-FINAL
          path: QamarOS.iso
