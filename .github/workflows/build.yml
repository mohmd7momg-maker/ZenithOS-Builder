name: Badr OS 2.0 ISO (Live + Stable v4.6 FIXED)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # ================= TOOLS =================
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin \
            grub-common mtools wget cpio util-linux busybox-static \
            ca-certificates dosfstools

      # ================= ROOTFS =================
      - name: Download Alpine rootfs
        run: |
          wget -q -O rootfs.tar.gz \
            https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-minirootfs-3.20.0-x86_64.tar.gz
          mkdir -p rootfs
          sudo tar xzf rootfs.tar.gz -C rootfs

      # ================= CHROOT BUILD =================
      - name: Build system in chroot
        run: |
          set -e

          for d in proc sys dev run; do
            sudo mkdir -p rootfs/$d
            sudo mount --bind /$d rootfs/$d
          done

          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf

          cleanup() {
            for d in run dev sys proc; do
              sudo umount -lf rootfs/$d 2>/dev/null || true
            done
          }
          trap cleanup EXIT

          sudo chroot rootfs /bin/sh -ex << 'CHROOT'

          cat > /etc/apk/repositories << EOF
          https://dl-cdn.alpinelinux.org/alpine/v3.20/main
          https://dl-cdn.alpinelinux.org/alpine/v3.20/community
          EOF

          apk update

          apk add --no-cache \
            linux-lts linux-firmware alpine-base openrc bash doas \
            dbus elogind connman seatd util-linux \
            labwc waybar foot wofi thunar firefox mesa-dri-gallium font-noto squashfs-tools

          # services
          rc-update add dbus default
          rc-update add elogind default
          rc-update add connman default
          rc-update add seatd default

          # user
          adduser -D admin
          addgroup admin wheel
          passwd -d admin

          echo "permit persist :wheel" > /etc/doas.conf

          # kernel modules
          KVER=$(ls /lib/modules | sort -V | tail -1)
          [ -n "$KVER" ] && depmod -a "$KVER" || true

          # GUI autostart
          cat > /etc/profile.d/gui.sh << 'EOF'
          if [ "$(tty)" = "/dev/tty1" ]; then
            exec dbus-run-session labwc
          fi
          EOF
          chmod +x /etc/profile.d/gui.sh

          rm -rf /var/cache/apk/*
          CHROOT

      # ================= CLEAN =================
      - name: Clean virtual FS
        run: |
          for d in run dev sys proc; do
            sudo umount -lf rootfs/$d 2>/dev/null || true
          done
          sudo rm -rf rootfs/proc rootfs/sys rootfs/dev rootfs/run

      # ================= KERNEL =================
      - name: Prepare kernel
        run: |
          mkdir -p iso_root/boot iso_root/EFI/BOOT

          KERNEL=$(ls rootfs/boot/vmlinuz-* | sort -V | tail -1)
          sudo cp "$KERNEL" iso_root/boot/vmlinuz

      # ================= INITRAMFS (FIXED LIVE BOOT) =================
      - name: Build initramfs
        run: |
          mkdir -p initramfs/bin initramfs/dev initramfs/proc initramfs/sys initramfs/newroot

          cp "$(which busybox)" initramfs/bin/

          cd initramfs
          for c in sh mount cat ls awk grep umount chroot mkdir; do
            ln -s busybox bin/$c
          done

          cat > init << 'EOF'
#!/bin/busybox sh

mount -t proc proc /proc
mount -t sysfs sys /sys
mount -t devtmpfs dev /dev

echo "[Badr OS] Starting Live Boot..."

modprobe squashfs 2>/dev/null

ROOTFS="/badr.squashfs"

if [ ! -f "$ROOTFS" ]; then
  for m in $(cat /proc/mounts | awk '{print $2}'); do
    if [ -f "$m/badr.squashfs" ]; then
      ROOTFS="$m/badr.squashfs"
      break
    fi
  done
fi

if [ ! -f "$ROOTFS" ]; then
  echo "ERROR: squashfs not found"
  exec sh
fi

mkdir -p /newroot

mount -t squashfs "$ROOTFS" /newroot || mount -o loop,ro "$ROOTFS" /newroot

exec switch_root /newroot /sbin/init
EOF

          chmod +x init

          find . | cpio -o -H newc | gzip > ../iso_root/boot/initramfs
          cd ..

      # ================= SQUASHFS =================
      - name: Build squashfs
        run: |
          sudo mksquashfs rootfs iso_root/badr.squashfs \
            -e proc sys dev run tmp var/run \
            -comp zstd -b 1M -processors $(nproc) -noappend

      # ================= GRUB =================
      - name: GRUB config
        run: |
          mkdir -p iso_root/boot/grub

          cat > iso_root/boot/grub/grub.cfg << 'EOF'
set timeout=3
set default=0

menuentry "Badr OS 2.0 Live Stable" {
    linux /boot/vmlinuz quiet
    initrd /boot/initramfs
}
EOF

      # ================= BIOS =================
      - name: BIOS bootloader
        run: |
          grub-mkstandalone --format=i386-pc \
            --output=iso_root/boot/grub/eltorito.img \
            "boot/grub/grub.cfg=iso_root/boot/grub/grub.cfg"

      # ================= UEFI =================
      - name: UEFI bootloader
        run: |
          grub-mkstandalone --format=x86_64-efi \
            --output=iso_root/EFI/BOOT/BOOTX64.EFI \
            "boot/grub/grub.cfg=iso_root/boot/grub/grub.cfg"

      # ================= ISO BUILD =================
      - name: Build ISO
        run: |
          xorriso -as mkisofs \
            -volid "BADR_OS" \
            -iso-level 3 \
            -eltorito-boot boot/grub/eltorito.img \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -eltorito-alt-boot \
            -e EFI/BOOT/BOOTX64.EFI \
            -no-emul-boot \
            -isohybrid-gpt-basdat \
            -output BadrOS.iso iso_root

      # ================= UPLOAD =================
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Badr-OS-2.0-Live-Stable-FIXED
          path: BadrOS.iso
          retention-days: 7
