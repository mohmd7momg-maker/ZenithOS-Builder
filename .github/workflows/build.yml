name: ZenithOS v3 FINAL SAFE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # ================= TOOLS =================
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin \
            grub-common mtools wget cpio util-linux busybox-static \
            ca-certificates dosfstools rsync

      # ================= ROOTFS =================
      - name: Download Alpine rootfs
        run: |
          wget -q -O rootfs.tar.gz \
            https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-minirootfs-3.20.0-x86_64.tar.gz
          mkdir -p rootfs
          sudo tar xzf rootfs.tar.gz -C rootfs

      # ================= CHROOT BUILD =================
      - name: Build system inside chroot
        run: |
          set -e

          for d in proc sys dev run; do
            sudo mkdir -p rootfs/$d
            sudo mount --bind /$d rootfs/$d
          done
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf

          cleanup() {
            echo ">>> Cleanup mounts..."
            for d in run dev sys proc; do
              sudo umount -R rootfs/$d 2>/dev/null || \
              sudo umount -lf rootfs/$d 2>/dev/null || true
            done
          }
          trap cleanup EXIT

          sudo chroot rootfs /bin/sh -ex << 'CHROOT'

cat > /etc/apk/repositories << EOF
https://dl-cdn.alpinelinux.org/alpine/v3.20/main
https://dl-cdn.alpinelinux.org/alpine/v3.20/community
EOF

apk update

apk add --no-cache \
  linux-lts linux-firmware alpine-base openrc bash doas \
  dbus elogind connman seatd util-linux \
  labwc waybar foot wofi thunar firefox-esr \
  mesa-dri-gallium font-noto

rc-update add dbus default
rc-update add elogind default
rc-update add connman default
rc-update add seatd default

adduser -D admin
addgroup admin wheel
passwd -d admin
echo "permit persist :wheel" > /etc/doas.conf

echo 'agetty_options="--autologin admin --noclear"' > /etc/conf.d/agetty.tty1

cat > /home/admin/.profile << 'EOF'
if [ "$(tty)" = "/dev/tty1" ]; then
  exec dbus-run-session labwc
fi
EOF
chown admin:admin /home/admin/.profile

rm -rf /var/cache/apk/*
CHROOT

      # ================= CLEANUP MOUNTS (SAFE) =================
      - name: Cleanup mounts (force)
        run: |
          echo ">>> Force unmounting..."
          for d in run dev sys proc; do
            sudo umount -R rootfs/$d 2>/dev/null || \
            sudo umount -lf rootfs/$d 2>/dev/null || true
          done

          # انتظار حتى تؤكد أن لا شيء معلق
          for i in $(seq 1 10); do
            if mount | grep -q "rootfs/proc\|rootfs/sys\|rootfs/dev"; then
              echo "  waiting for unmount... ($i)"
              sleep 1
            else
              echo "  all unmounted OK"
              break
            fi
          done

          if mount | grep -q "rootfs/proc\|rootfs/sys\|rootfs/dev"; then
            echo "FATAL: still mounted!"
            exit 1
          fi

          # حذف المجلدات وإعادة إنشائها فارغة
          for d in proc sys dev run tmp; do
            sudo rm -rf rootfs/$d
            sudo mkdir -p rootfs/$d
          done
          sudo chmod 1777 rootfs/tmp
          sudo rm -f rootfs/etc/resolv.conf

      # ================= BUILD SQUASHFS (CLEAN) =================
      - name: Build squashfs
        run: |
          echo "Building squashfs cleanly..."
          sudo mksquashfs rootfs iso_root/zenith.squashfs \
            -noappend \
            -comp zstd \
            -Xcompression-level 3 \
            -one-file-system \
            -processors $(nproc) \
            -quiet

      # ================= KERNEL =================
      - name: Copy kernel
        run: |
          mkdir -p iso_root/boot iso_root/EFI/BOOT
          KERNEL=$(ls rootfs/boot/vmlinuz-* | sort -V | tail -1)
          if [ -z "$KERNEL" ]; then
            echo "ERROR: kernel not found!"
            exit 1
          fi
          sudo cp "$KERNEL" iso_root/boot/vmlinuz

      # ================= INITRAMFS =================
      - name: Build initramfs
        run: |
          mkdir -p initramfs/bin initramfs/newroot
          cp "$(which busybox)" initramfs/bin/

          cd initramfs
          for cmd in sh mount cat ls awk grep umount switch_root mkdir sleep; do
            ln -s busybox bin/$cmd
          done

          cat > init << 'EOF'
#!/bin/busybox sh

mount -t proc proc /proc
mount -t sysfs sys /sys
mount -t devtmpfs dev /dev

echo "[ZenithOS] Searching for zenith.squashfs..."
sleep 1

mkdir -p /media /newroot
SQUASH=""

for dev in /dev/sr0 /dev/sda /dev/sdb /dev/vda /dev/hda /dev/nvme0n1; do
  [ -b "$dev" ] || continue
  echo "Trying $dev..."
  if mount -o ro "$dev" /media 2>/dev/null; then
    if [ -f "/media/zenith.squashfs" ]; then
      SQUASH="/media/zenith.squashfs"
      echo "Found on $dev"
      break
    fi
    umount /media 2>/dev/null
  fi
done

if [ -z "$SQUASH" ]; then
  echo "FATAL: zenith.squashfs not found"
  exec /bin/sh
fi

mount -t squashfs -o loop,ro "$SQUASH" /newroot
umount -l /proc /sys /dev 2>/dev/null
exec switch_root /newroot /sbin/init
EOF

          chmod +x init
          find . | cpio -o -H newc | gzip > ../iso_root/boot/initramfs
          cd ..

      # ================= GRUB =================
      - name: GRUB setup
        run: |
          mkdir -p iso_root/boot/grub iso_root/EFI/BOOT

          cat > iso_root/boot/grub/grub.cfg << 'EOF'
set timeout=3
set default=0

menuentry "ZenithOS v3" {
    linux /boot/vmlinuz quiet loglevel=3
    initrd /boot/initramfs
}
EOF

          # BIOS
          grub-mkimage -O i386-pc -o /tmp/core.img -p /boot/grub \
            biosdisk iso9660 normal linux configfile

          cat /usr/lib/grub/i386-pc/cdboot.img /tmp/core.img > iso_root/boot/grub/eltorito.img

          # UEFI
          grub-mkstandalone --format=x86_64-efi \
            --output=iso_root/EFI/BOOT/BOOTX64.EFI \
            "boot/grub/grub.cfg=iso_root/boot/grub/grub.cfg"

          dd if=/dev/zero of=iso_root/efi.img bs=1M count=4
          mkfs.vfat iso_root/efi.img
          mmd -i iso_root/efi.img ::/EFI ::/EFI/BOOT
          mcopy -i iso_root/efi.img iso_root/EFI/BOOT/BOOTX64.EFI ::/EFI/BOOT/

      # ================= ISO =================
      - name: Build ISO
        run: |
          xorriso -as mkisofs \
            -volid "ZENITH_V3" \
            -iso-level 3 \
            -eltorito-boot boot/grub/eltorito.img \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            --grub2-mbr /usr/lib/grub/i386-pc/boot_hybrid.img \
            --grub2-boot-info \
            -eltorito-alt-boot \
            -e efi.img -no-emul-boot \
            -isohybrid-gpt-basdat \
            -output ZenithOS.iso iso_root

      # ================= UPLOAD =================
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ZenithOS-v3-FINAL
          path: ZenithOS.iso
          retention-days: 7
