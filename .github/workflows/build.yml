name: QamarOS Zero Errors Stable Build

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Admin password'
        required: false
        default: 'liveuser'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # ================= TOOLS =================
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin \
            grub-common mtools wget cpio util-linux busybox-static \
            ca-certificates dosfstools rsync

      # ================= ROOTFS =================
      - name: Download Alpine rootfs
        run: |
          wget -q -O rootfs.tar.gz \
            https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-minirootfs-3.20.0-x86_64.tar.gz
          mkdir rootfs
          sudo tar xzf rootfs.tar.gz -C rootfs

      # ================= CHROOT BUILD =================
      - name: Build system
        run: |
          for d in proc sys dev; do
            sudo mount --bind /$d rootfs/$d
          done

          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf

          sudo chroot rootfs /bin/sh -ex << 'CHROOT'

          cat > /etc/apk/repositories << EOF
          https://dl-cdn.alpinelinux.org/alpine/v3.20/main
          https://dl-cdn.alpinelinux.org/alpine/v3.20/community
          EOF

          apk update

          apk add --no-cache \
            alpine-base linux-lts openrc bash doas \
            eudev dbus elogind connman \
            seatd wpa_supplicant \
            labwc waybar foot wofi thunar firefox \
            pipewire pipewire-pulse wireplumber \
            mesa-dri-gallium font-noto zram-init \
            htop neofetch

          # ================= USER =================
          adduser -D -s /bin/bash admin
          echo "admin:${{ inputs.password }}" | chpasswd
          passwd -l root

          for g in wheel audio video seat input netdev; do
            addgroup admin $g 2>/dev/null || true
          done

          echo "permit persist :wheel" > /etc/doas.conf

          # ================= SERVICES =================
          rc-update add udev sysinit
          rc-update add dbus boot
          rc-update add elogind default
          rc-update add seatd default
          rc-update add connman default
          rc-update add zram-init default

          # ================= ZRAM =================
          echo 'zram_size="40%"' > /etc/conf.d/zram-init
          echo 'zram_algorithm="zstd"' >> /etc/conf.d/zram-init

          # ================= SECURITY =================
          cat > /etc/sysctl.d/qamar.conf << 'EOF'
kernel.kptr_restrict=2
kernel.dmesg_restrict=1
kernel.randomize_va_space=2
fs.protected_symlinks=1
fs.protected_hardlinks=1
EOF

          # ================= INITRAMFS =================
          KVER=$(ls /lib/modules | sort -V | tail -1)
          depmod -a "$KVER"
          mkinitfs -o /boot/initramfs-qamar "$KVER"

          rm -rf /var/cache/apk/*
          CHROOT

          for d in proc sys dev; do
            sudo umount -lf rootfs/$d 2>/dev/null || true
          done

      # ================= CLEAN VIRTUAL FS =================
      - name: Clean rootfs
        run: |
          sudo rm -rf rootfs/proc rootfs/sys rootfs/dev rootfs/run rootfs/tmp 2>/dev/null || true
          sudo mkdir -p rootfs/proc rootfs/sys rootfs/dev rootfs/run rootfs/tmp
          sudo chmod 1777 rootfs/tmp

      # ================= CREATE CLEAN ROOTFS =================
      - name: Create clean rootfs (FIX PROC ISSUE)
        run: |
          sudo rsync -a --delete \
            --exclude='proc' \
            --exclude='sys' \
            --exclude='dev' \
            --exclude='run' \
            --exclude='tmp' \
            --exclude='var/run' \
            rootfs/ clean_rootfs/

          sudo rm -rf clean_rootfs/proc clean_rootfs/sys clean_rootfs/dev 2>/dev/null || true
          sudo rm -rf clean_rootfs/run clean_rootfs/tmp 2>/dev/null || true

          sudo mkdir -p clean_rootfs/proc clean_rootfs/sys clean_rootfs/dev
          sudo mkdir -p clean_rootfs/run clean_rootfs/tmp
          sudo chmod 1777 clean_rootfs/tmp

      # ================= SQUASHFS =================
      - name: Build squashfs
        run: |
          mkdir -p iso_root/boot

          sudo cp rootfs/boot/vmlinuz-lts iso_root/boot/vmlinuz 2>/dev/null || true
          sudo cp rootfs/boot/initramfs-qamar iso_root/boot/initramfs 2>/dev/null || true

          sudo mksquashfs clean_rootfs iso_root/qamar.squashfs \
            -comp zstd \
            -b 1M \
            -Xcompression-level 6 \
            -processors $(nproc) \
            -noappend \
            -quiet

      # ================= GRUB =================
      - name: GRUB config
        run: |
          mkdir -p iso_root/boot/grub

          cat > iso_root/boot/grub/grub.cfg << 'EOF'
set timeout=3
set default=0

menuentry "QamarOS Stable" {
    linux /boot/vmlinuz quiet root=LABEL=QAMAR_OS
    initrd /boot/initramfs
}
EOF

      # ================= BIOS =================
      - name: BIOS boot
        run: |
          grub-mkstandalone --format=i386-pc \
            --output=iso_root/boot/grub/eltorito.img \
            "boot/grub/grub.cfg=iso_root/boot/grub/grub.cfg"

      # ================= ISO =================
      - name: Build ISO
        run: |
          xorriso -as mkisofs \
            -volid "QAMAR_OS" \
            -eltorito-boot boot/grub/eltorito.img \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -output QamarOS.iso iso_root

      # ================= UPLOAD =================
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: QamarOS-Zero-Errors
          path: QamarOS.iso
          retention-days: 7
