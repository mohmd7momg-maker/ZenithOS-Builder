name: Build ZenithOS 2.0 ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Host Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin \
            mtools wget ca-certificates dosfstools

      - name: Prepare Alpine RootFS
        run: |
          wget -q https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-minirootfs-3.20.0-x86_64.tar.gz
          mkdir -p rootfs
          sudo tar xzf alpine-minirootfs-3.20.0-x86_64.tar.gz -C rootfs
          sudo mount --bind /proc rootfs/proc
          sudo mount --bind /sys  rootfs/sys
          sudo mount --bind /dev  rootfs/dev
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf

      - name: Internal System Build (Chroot)
        run: |
          sudo chroot rootfs /bin/sh -ex << 'CHROOT'
          # إعداد المستودعات بشكل صحيح
          echo "https://dl-cdn.alpinelinux.org/alpine/v3.20/main" > /etc/apk/repositories
          echo "https://dl-cdn.alpinelinux.org/alpine/v3.20/community" >> /etc/apk/repositories

          apk update -q && apk upgrade -q
          
          # تثبيت الحزم (تم تصحيح اسم الخطوط إلى font-noto)
          apk add -q --no-cache \
            alpine-base linux-lts openrc bash sudo \
            eudev udev-init-scripts elogind elogind-openrc \
            dbus dbus-openrc seatd seatd-openrc \
            ca-certificates tzdata connman connman-openrc \
            wpa_supplicant pipewire pipewire-alsa pipewire-pulse \
            wireplumber labwc waybar foot firefox-esr thunar \
            font-noto fontconfig mesa-dri-gallium

          # إعداد المستخدم والمجموعات
          addgroup wheel 2>/dev/null || true
          adduser -D -s /bin/bash admin
          echo "admin:password123" | chpasswd
          for grp in wheel audio video seat input netdev; do 
            addgroup admin $grp 2>/dev/null || true
          done
          echo "%wheel ALL=(ALL) ALL" >> /etc/sudoers

          # إعدادات Labwc (التشغيل التلقائي)
          mkdir -p /etc/xdg/labwc
          cat > /etc/xdg/labwc/autostart << 'EOF'
          waybar &
          pipewire &
          wireplumber &
          EOF

          # ضبط الخدمات وتصحيح udev
          rc-update del mdev sysinit 2>/dev/null || true
          rc-update add udev sysinit
          for s in dbus seatd connman elogind; do rc-update add $s default; done

          # بناء initramfs مع ميزات live و modloop
          cat > /etc/mkinitfs/mkinitfs.conf << 'EOF'
          features="base squashfs modloop live kms virtio network usb standard"
          EOF
          KVER=$(ls /lib/modules | head -1)
          mkinitfs -o /boot/initramfs-zenith $KVER
          CHROOT

      - name: Create modloop & SquashFS
        run: |
          mkdir -p iso_root/boot
          sudo mksquashfs rootfs/lib/modules iso_root/boot/modloop -comp zstd -Xcompression-level 15
          sudo rm -rf rootfs/lib/modules
          sudo mksquashfs rootfs iso_root/zenith.squashfs -comp zstd -Xcompression-level 15

      - name: Prepare Bootloaders (UEFI + BIOS)
        run: |
          sudo cp rootfs/boot/vmlinuz-lts iso_root/boot/vmlinuz
          sudo cp rootfs/boot/initramfs-zenith iso_root/boot/initramfs
          
          mkdir -p iso_root/boot/grub/i386-pc
          cat > grub.cfg << 'GRUB'
          set default=0
          set timeout=3
          menuentry "ZenithOS 2.0 Live" {
            linux /boot/vmlinuz quiet loglevel=3 root=live:LABEL=ZENITH_OS modloop=/boot/modloop modules=loop,squashfs
            initrd /boot/initramfs
          }
          GRUB
          cp grub.cfg iso_root/boot/grub/grub.cfg

          # إعداد إقلاع BIOS (Legacy)
          grub-mkstandalone --format=i386-pc --output=iso_root/boot/grub/i386-pc/eltorito.img "boot/grub/grub.cfg=grub.cfg"
          
          # إعداد إقلاع UEFI
          grub-mkstandalone --format=x86_64-efi --output=bootx64.efi "boot/grub/grub.cfg=grub.cfg"
          dd if=/dev/zero of=efi.img bs=1M count=4
          mkfs.vfat efi.img
          mmd -i efi.img ::/EFI ::/EFI/BOOT
          mcopy -i efi.img bootx64.efi ::/EFI/BOOT/
          mv efi.img iso_root/

      - name: Final ISO Generation (Hybrid)
        run: |
          xorriso -as mkisofs -iso-level 3 -full-iso9660-filenames \
            -volid "ZENITH_OS" \
            -eltorito-boot boot/grub/i386-pc/eltorito.img \
            -no-emul-boot -boot-load-size 4 -boot-info-table --grub2-boot-info \
            --grub2-mbr /usr/lib/grub/i386-pc/boot_hybrid.img \
            -eltorito-alt-boot -e efi.img -no-emul-boot -isohybrid-gpt-basdat \
            -append_partition 2 0xef iso_root/efi.img \
            -output ZenithOS-2.0-x86_64.iso iso_root

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenithOS-Final-ISO
          path: ZenithOS-2.0-x86_64.iso
