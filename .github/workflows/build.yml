name: QamarOS 2.0 Production Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Host Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin \
            grub-common mtools wget ca-certificates dosfstools cpio

      - name: Prepare Alpine RootFS
        run: |
          wget -q https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-minirootfs-3.20.0-x86_64.tar.gz
          mkdir -p rootfs
          sudo tar xzf alpine-minirootfs-3.20.0-x86_64.tar.gz -C rootfs

          for d in proc sys dev; do
            sudo mount --bind /$d rootfs/$d
          done

          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf

      - name: Internal System Build (Chroot)
        run: |
          sudo chroot rootfs /bin/sh -ex << 'CHROOT'

          echo "https://dl-cdn.alpinelinux.org/alpine/v3.20/main" > /etc/apk/repositories
          echo "https://dl-cdn.alpinelinux.org/alpine/v3.20/community" >> /etc/apk/repositories

          apk update -q

          apk add -q --no-cache \
            alpine-base linux-lts openrc bash doas \
            eudev udev-init-scripts elogind elogind-openrc dbus dbus-openrc \
            seatd seatd-openrc connman connman-openrc wpa_supplicant \
            pipewire pipewire-pulse wireplumber labwc waybar foot \
            librewolf thunar font-noto mesa-dri-gallium wbg zram-init

          echo "permit :wheel" > /etc/doas.conf

          addgroup wheel 2>/dev/null || true
          adduser -D -s /bin/bash admin
          echo "admin:password123" | chpasswd

          for g in wheel audio video seat input netdev; do
            addgroup admin $g 2>/dev/null || true
          done

          rc-update add zram-init default
          echo 'zram_size="40%"' > /etc/conf.d/zram-init

          KVER=$(basename $(readlink -f /lib/modules/*/build 2>/dev/null | head -1))

          if [ -z "$KVER" ] || [ ! -d "/lib/modules/$KVER" ]; then
            echo "Kernel detection failed"
            exit 1
          fi

          depmod -a $KVER || true

          cat > /etc/mkinitfs/mkinitfs.conf << 'EOF'
          features="base squashfs modloop live kms virtio usb standard"
          EOF

          mkinitfs -o /boot/initramfs-qamar $KVER

          mkdir -p /home/admin
          echo "exec labwc" > /home/admin/.bash_profile
          chown -R admin:admin /home/admin

          rc-update add udev sysinit
          rc-update add dbus boot
          rc-update add elogind boot

          for s in seatd connman; do
            rc-update add $s default
          done

          CHROOT

      - name: Cleanup mounts
        if: always()
        run: |
          for d in proc sys dev; do
            sudo umount -l rootfs/$d || true
          done

      - name: Build modloop & squashfs
        run: |
          mkdir -p iso_root/boot

          KVER=$(ls rootfs/lib/modules | head -1)

          if [ ! -d "rootfs/lib/modules/$KVER" ]; then
            echo "Missing kernel modules"
            exit 1
          fi

          sudo mksquashfs rootfs/lib/modules/$KVER \
            iso_root/boot/modloop-$KVER \
            -comp zstd -b 1M -Xcompression-level 15

          sudo rm -rf rootfs/lib/modules

          sudo mksquashfs rootfs iso_root/qamar.squashfs \
            -comp zstd -b 1M -Xcompression-level 15

          echo "KVER=$KVER" >> $GITHUB_ENV

      - name: Bootloader setup
        run: |
          sudo cp rootfs/boot/vmlinuz-lts iso_root/boot/vmlinuz
          sudo cp rootfs/boot/initramfs-qamar iso_root/boot/initramfs

          mkdir -p iso_root/boot/grub/i386-pc

          cat > grub.cfg << EOF
          set timeout=2
          set default=0
          set gfxpayload=keep

          menuentry "QamarOS 2.0 Production" {
            linux /boot/vmlinuz quiet loglevel=3 mitigations=off \
            root=live:LABEL=QAMAR_OS modloop=/boot/modloop-${{ env.KVER }} modules=loop,squashfs
            initrd /boot/initramfs
          }
          EOF

          cp grub.cfg iso_root/boot/grub/grub.cfg

          grub-mkstandalone --format=i386-pc \
            --output=iso_root/boot/grub/i386-pc/eltorito.img \
            --install-modules="biosdisk part_msdos part_gpt fat iso9660 search linux configfile normal gzio" \
            "boot/grub/grub.cfg=grub.cfg"

          grub-mkstandalone --format=x86_64-efi \
            --output=bootx64.efi \
            --install-modules="part_gpt fat iso9660 search gzio linux normal" \
            "boot/grub/grub.cfg=grub.cfg"

          dd if=/dev/zero of=efi.img bs=1M count=4
          mkfs.vfat efi.img

          mmd -i efi.img ::/EFI
          mmd -i efi.img ::/EFI/BOOT

          mcopy -i efi.img bootx64.efi ::/EFI/BOOT/

          mv efi.img iso_root/

      - name: Create ISO
        run: |
          xorriso -as mkisofs \
            -iso-level 3 \
            -full-iso9660-filenames \
            -volid "QAMAR_OS" \
            -eltorito-boot boot/grub/i386-pc/eltorito.img \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            --grub2-boot-info \
            --grub2-mbr /usr/lib/grub/i386-pc/boot_hybrid.img \
            -eltorito-alt-boot -e efi.img \
            -no-emul-boot -isohybrid-gpt-basdat \
            -append_partition 2 0xef iso_root/efi.img \
            -output QamarOS-2.0-Production.iso iso_root

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QamarOS-Production-Final
          path: QamarOS-2.0-Production.iso
