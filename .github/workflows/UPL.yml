name: Build UPL-OS (Ultra Performance Linux)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upl-build.yml'

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Maximize Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker system prune -af || true

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/pacman-cache
          key: pacman-${{ runner.os }}-${{ hashFiles('.github/workflows/upl-build.yml') }}
          restore-keys: |
            pacman-${{ runner.os }}-

      - name: Create build script
        run: |
          cat > ${{ github.workspace }}/build.sh <<'BUILD_SCRIPT'
          #!/usr/bin/env bash
          set -e

          echo "[*] إعداد الحاوية وتثبيت الأدوات..."
          pacman-key --init
          pacman-key --populate archlinux

          # استيراد مفتاح CachyOS الصحيح
          pacman-key --keyserver keyserver.ubuntu.com --recv-keys 882DCFE48E2051D48E2562ABF3B607488DB35A47
          pacman-key --lsign-key 882DCFE48E2051D48E2562ABF3B607488DB35A47

          # استخدام المرآة الرئيسية لتجنب DNS
          mkdir -p /etc/pacman.d
          echo 'Server = https://mirror.cachyos.org/repo/$arch/$repo' > /etc/pacman.d/cachyos-mirrorlist

          echo "[cachyos]
          Include = /etc/pacman.d/cachyos-mirrorlist" >> /etc/pacman.conf

          pacman -Sy --noconfirm archiso git curl reflector cachyos-keyring
          reflector --latest 10 --protocol https --country "United States,Germany,France" --sort rate --save /etc/pacman.d/mirrorlist
          pacman-key --populate cachyos

          WORKDIR="/workspace/upl-iso-build"
          PROFILE_DIR="$WORKDIR/archiso"

          echo "[*] تجهيز بيئة البناء..."
          mkdir -p "$WORKDIR"
          rm -rf "$PROFILE_DIR"
          mkdir -p "$PROFILE_DIR"
          cp -r /usr/share/archiso/configs/releng/* "$PROFILE_DIR"
          cd "$PROFILE_DIR"

          sed -i '/^linux$/d; /^linux-headers$/d' packages.x86_64

          # ---- pacman.conf (معمارية متعددة + CacheDir) ----
          cat > pacman.conf <<'EOF'
          [options]
          HoldPkg     = pacman glibc
          Architecture = x86_64 x86_64_v3
          SigLevel    = Required DatabaseOptional
          LocalFileSigLevel = Optional
          CacheDir    = /workspace/pacman-cache

          [cachyos-v3]
          Include = /etc/pacman.d/cachyos-v3-mirrorlist

          [cachyos]
          Include = /etc/pacman.d/cachyos-mirrorlist

          [core]
          Include = /etc/pacman.d/mirrorlist
          [extra]
          Include = /etc/pacman.d/mirrorlist
          [multilib]
          Include = /etc/pacman.d/mirrorlist
          EOF

          # ---- تحميل مرايا CachyOS (مع استبدال لمرآة آمنة) ----
          mkdir -p airootfs/etc/pacman.d
          echo "[*] إعداد مرايا CachyOS..."
          for repo in cachyos-v3 cachyos; do
            echo "Server = https://mirror.cachyos.org/repo/\$arch/\$repo" > "/etc/pacman.d/${repo}-mirrorlist"
            cp "/etc/pacman.d/${repo}-mirrorlist" "airootfs/etc/pacman.d/${repo}-mirrorlist"
          done

          # ---- الحزم (مُحسَّنة) ----
          cat >> packages.x86_64 <<'EOF'
          cachyos-keyring
          cachyos-settings
          cachyos-hooks
          cachy-chroot
          intel-ucode
          amd-ucode
          dkms
          grub
          efibootmgr
          os-prober
          mtools
          dosfstools
          cryptsetup
          linux-cachyos-lts
          linux-cachyos-lts-headers
          linux-firmware
          sof-firmware
          alsa-firmware
          alsa-ucm-conf
          plasma-desktop
          sddm
          plasma-nm
          plasma-systemmonitor
          konsole
          dolphin
          ark
          okular
          gwenview
          spectacle
          kate
          kcalc
          flatpak
          xdg-desktop-portal
          xdg-desktop-portal-kde
          zram-generator
          ananicy-cpp
          power-profiles-daemon
          apparmor
          ufw
          openssh
          btrfs-progs
          timeshift
          snapper
          snap-pac
          grub-btrfs
          inotify-tools
          pipewire
          pipewire-pulse
          pipewire-alsa
          pipewire-jack
          wireplumber
          pavucontrol-qt
          gst-plugin-pipewire
          networkmanager
          network-manager-applet
          bluez
          bluez-utils
          cups
          mesa
          vulkan-intel
          vulkan-radeon
          intel-media-driver
          nvidia-dkms
          nvidia-utils
          lib32-nvidia-utils
          xf86-video-amdgpu
          xf86-video-intel
          htop
          fastfetch
          git
          curl
          wget
          reflector
          sudo
          gparted
          ntfs-3g
          exfatprogs
          f2fs-tools
          cachyos-calamares
          noto-fonts
          noto-fonts-cjk
          ttf-dejavu
          ttf-liberation
          papirus-icon-theme
          breeze-icons
          firefox
          libreoffice-fresh
          vlc
          gimp
          EOF

          # ---- إعداد المستخدم arch ----
          mkdir -p airootfs/home/arch
          chown -R 1000:1000 airootfs/home/arch
          chmod 750 airootfs/home/arch

          mkdir -p airootfs/etc/sudoers.d
          echo 'arch ALL=(ALL:ALL) NOPASSWD: ALL' > airootfs/etc/sudoers.d/arch
          chmod 440 airootfs/etc/sudoers.d/arch

          # ---- Nvidia KMS ----
          if [ -f airootfs/etc/mkinitcpio.conf ]; then
              sed -i 's/^MODULES=(/MODULES=(nvidia nvidia_modeset nvidia_uvm nvidia_drm /' airootfs/etc/mkinitcpio.conf
          fi

          # ---- sysctl ----
          mkdir -p airootfs/etc/sysctl.d
          cat > airootfs/etc/sysctl.d/99-upl-performance.conf <<'EOF'
          vm.swappiness=80
          vm.vfs_cache_pressure=50
          vm.dirty_ratio=10
          vm.dirty_background_ratio=5
          vm.page-cluster=0
          vm.min_free_kbytes=65536
          kernel.kptr_restrict=2
          kernel.unprivileged_bpf_disabled=1
          kernel.yama.ptrace_scope=1
          kernel.randomize_va_space=2
          net.core.bpf_jit_harden=2
          fs.file-max=2097152
          net.core.default_qdisc=cake
          net.ipv4.tcp_congestion_control=bbr
          net.ipv4.tcp_fastopen=3
          net.ipv4.tcp_syncookies=
