name: Build UPL-OS (Ultra Performance Linux)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upl-build.yml'

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Maximize Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker system prune -af || true

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/pacman-cache
          key: pacman-${{ runner.os }}-${{ hashFiles('.github/workflows/upl-build.yml') }}
          restore-keys: |
            pacman-${{ runner.os }}-

      - name: Create build script
        run: |
          cat > ${{ github.workspace }}/build.sh <<'BUILD_SCRIPT'
          #!/usr/bin/env bash
          set -e
          echo "بدء build.sh ..."

          # ---- إعداد الحاوية ----
          pacman-key --init
          pacman-key --populate archlinux
          pacman-key --keyserver keyserver.ubuntu.com --recv-keys 882DCFE48E2051D48E2562ABF3B607488DB35A47
          pacman-key --lsign-key 882DCFE48E2051D48E2562ABF3B607488DB35A47

          mkdir -p /etc/pacman.d
          echo 'Server = https://mirror.cachyos.org/repo/$arch/$repo' > /etc/pacman.d/cachyos-mirrorlist

          echo "[cachyos]
          Include = /etc/pacman.d/cachyos-mirrorlist" >> /etc/pacman.conf

          pacman -Sy --noconfirm archiso git curl reflector cachyos-keyring archlinux-keyring
          reflector --latest 10 --protocol https --country "United States,Germany,France" --sort rate --save /etc/pacman.d/mirrorlist
          pacman-key --populate cachyos archlinux

          # ---- تجهيز بيئة البناء ----
          WORKDIR="/workspace/upl-iso-build"
          PROFILE_DIR="$WORKDIR/archiso"
          mkdir -p "$WORKDIR"
          rm -rf "$PROFILE_DIR"
          mkdir -p "$PROFILE_DIR"
          cp -r /usr/share/archiso/configs/releng/* "$PROFILE_DIR"
          cd "$PROFILE_DIR"

          sed -i '/^linux$/d; /^linux-headers$/d' packages.x86_64

          # ---- pacman.conf للبناء (يدعم x86_64_v3) ----
          cat > pacman.conf <<'EOF'
          [options]
          HoldPkg     = pacman glibc
          Architecture = x86_64 x86_64_v3
          SigLevel    = Required DatabaseOptional
          LocalFileSigLevel = Optional
          CacheDir    = /workspace/pacman-cache

          [cachyos-v3]
          Include = /etc/pacman.d/cachyos-v3-mirrorlist

          [cachyos]
          Include = /etc/pacman.d/cachyos-mirrorlist

          [core]
          Include = /etc/pacman.d/mirrorlist
          [extra]
          Include = /etc/pacman.d/mirrorlist
          [multilib]
          Include = /etc/pacman.d/mirrorlist
          EOF

          # ---- مرايا CachyOS موثوقة ----
          mkdir -p airootfs/etc/pacman.d
          for repo in cachyos-v3 cachyos; do
            echo "Server = https://mirror.cachyos.org/repo/\$arch/\$repo" > "/etc/pacman.d/${repo}-mirrorlist"
            cp "/etc/pacman.d/${repo}-mirrorlist" "airootfs/etc/pacman.d/${repo}-mirrorlist"
          done

          # ---- الحزم ----
          cat >> packages.x86_64 <<'EOF'
          cachyos-keyring
          cachyos-settings
          cachyos-hooks
          cachy-chroot
          intel-ucode
          amd-ucode
          dkms
          grub
          efibootmgr
          os-prober
          mtools
          dosfstools
          cryptsetup
          linux-cachyos-lts
          linux-cachyos-lts-headers
          linux-firmware
          sof-firmware
          alsa-firmware
          alsa-ucm-conf
          plasma-desktop
          sddm
          plasma-nm
          plasma-systemmonitor
          konsole
          dolphin
          ark
          okular
          gwenview
          spectacle
          kate
          kcalc
          flatpak
          xdg-desktop-portal
          xdg-desktop-portal-kde
          zram-generator
          ananicy-cpp
          power-profiles-daemon
          apparmor
          ufw
          openssh
          btrfs-progs
          timeshift
          snapper
          snap-pac
          grub-btrfs
          inotify-tools
          pipewire
          pipewire-pulse
          pipewire-alsa
          pipewire-jack
          wireplumber
          pavucontrol-qt
          gst-plugin-pipewire
          networkmanager
          network-manager-applet
          bluez
          bluez-utils
          cups
          mesa
          vulkan-intel
          vulkan-radeon
          intel-media-driver
          nvidia-dkms
          nvidia-utils
          lib32-nvidia-utils
          xf86-video-amdgpu
          xf86-video-intel
          htop
          fastfetch
          git
          curl
          wget
          reflector
          sudo
          gparted
          ntfs-3g
          exfatprogs
          f2fs-tools
          cachyos-calamares
          noto-fonts
          noto-fonts-cjk
          ttf-dejavu
          ttf-liberation
          papirus-icon-theme
          breeze-icons
          firefox
          libreoffice-fresh
          vlc
          gimp
          EOF

          # ---- المستخدم arch ----
          mkdir -p airootfs/home/arch
          chown -R 1000:1000 airootfs/home/arch
          chmod 750 airootfs/home/arch
          mkdir -p airootfs/etc/sudoers.d
          echo 'arch ALL=(ALL:ALL) NOPASSWD: ALL' > airootfs/etc/sudoers.d/arch
          chmod 440 airootfs/etc/sudoers.d/arch

          # ---- Nvidia KMS ----
          if [ -f airootfs/etc/mkinitcpio.conf ]; then
              sed -i 's/^MODULES=(/MODULES=(nvidia nvidia_modeset nvidia_uvm nvidia_drm /' airootfs/etc/mkinitcpio.conf
          fi

          # ---- sysctl ----
          mkdir -p airootfs/etc/sysctl.d
          cat > airootfs/etc/sysctl.d/99-upl-performance.conf <<'EOF'
          vm.swappiness=80
          vm.vfs_cache_pressure=50
          vm.dirty_ratio=10
          vm.dirty_background_ratio=5
          vm.page-cluster=0
          vm.min_free_kbytes=65536
          kernel.kptr_restrict=2
          kernel.unprivileged_bpf_disabled=1
          kernel.yama.ptrace_scope=1
          kernel.randomize_va_space=2
          net.core.bpf_jit_harden=2
          fs.file-max=2097152
          net.core.default_qdisc=cake
          net.ipv4.tcp_congestion_control=bbr
          net.ipv4.tcp_fastopen=3
          net.ipv4.tcp_syncookies=1
          net.ipv4.conf.all.rp_filter=1
          net.ipv4.conf.default.rp_filter=1
          EOF

          # ---- zram ----
          mkdir -p airootfs/etc/systemd/zram-generator.conf.d
          cat > airootfs/etc/systemd/zram-generator.conf.d/zram.conf <<'EOF'
          [zram0]
          zram-size = min(ram / 2, 4096)
          compression-algorithm = zstd
          swap-priority = 100
          EOF

          # ---- SDDM ----
          mkdir -p airootfs/etc/sddm.conf.d
          cat > airootfs/etc/sddm.conf.d/kde_settings.conf <<'EOF'
          [Autologin]
          User=arch
          Session=plasma
          [General]
          DisplayServer=wayland
          [Theme]
          Current=breeze
          EOF

          enable_service() {
              mkdir -p "airootfs/etc/systemd/system/$2.wants"
              ln -sf "/usr/lib/systemd/system/$1" "airootfs/etc/systemd/system/$2.wants/$1"
          }
          enable_service sddm.service graphical.target
          enable_service NetworkManager.service multi-user.target
          enable_service bluetooth.service multi-user.target
          enable_service ufw.service multi-user.target
          enable_service apparmor.service multi-user.target
          enable_service ananicy-cpp.service multi-user.target
          enable_service power-profiles-daemon.service multi-user.target
          enable_service cups.service multi-user.target
          enable_service sshd.service multi-user.target

          # ---- Calamares autostart ----
          mkdir -p airootfs/etc/xdg/autostart
          cat > airootfs/etc/xdg/autostart/calamares.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Install System
          Exec=cachyos-calamares
          Icon=system-software-install
          Categories=System;
          X-GNOME-Autostart-enabled=true
          X-KDE-autostart-after=panel
          NoDisplay=false
          EOF

          # ---- حفظ pacman.conf للنظام المثبت ----
          mkdir -p airootfs/usr/local/share/upl
          grep -v "^CacheDir" pacman.conf > airootfs/usr/local/share/upl/pacman.conf

          # ---- ضغط squashfs ----
          if grep -q "^squashfs_options=" profiledef.sh; then
              sed -i "s|^squashfs_options=.*|squashfs_options=\"-comp zstd -Xcompression-level 1\"|" profiledef.sh
          else
              echo "squashfs_options=\"-comp zstd -Xcompression-level 1\"" >> profiledef.sh
          fi

          # ==============================
          # 🔑 تجديد المفاتيح (منع GPGME)
          # ==============================
          pacman-key --init
          pacman-key --populate archlinux cachyos
          pacman-key --refresh-keys || true

          # ---- بناء ISO ----
          echo "بدء mkarchiso..."
          mkarchiso -v -w "$WORKDIR/archiso-tmp" -o "$WORKDIR/out" "$PROFILE_DIR"
          echo "انتهى mkarchiso"

          rm -rf "$WORKDIR/archiso-tmp"
          [ $EUID -eq 0 ] && chown -R 1000:1000 "$WORKDIR/out" 2>/dev/null || true

          ISO_FILE=$(ls -t "$WORKDIR/out"/*.iso 2>/dev/null | head -1)
          if [ -n "$ISO_FILE" ]; then
              echo "✅ تم إنشاء ISO: $ISO_FILE"
          else
              echo "❌ فشل: لم يتم العثور على ملف ISO"
              exit 1
          fi
          BUILD_SCRIPT

      - name: Ensure build script is valid
        run: |
          test -s ${{ github.workspace }}/build.sh || { echo "build.sh missing!"; exit 1; }
          chmod +x ${{ github.workspace }}/build.sh

      - name: Run build inside container
        run: |
          mkdir -p ${{ github.workspace }}/pacman-cache
          docker run --rm --privileged \
            -e HOME=/workspace \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            archlinux:latest \
            /workspace/build.sh

      - name: Verify ISO creation
        run: |
          ls -la ${{ github.workspace }}/upl-iso-build/out/
          test -f ${{ github.workspace }}/upl-iso-build/out/*.iso || { echo "ISO not found!"; exit 1; }

      - name: Generate Checksums
        run: |
          cd ${{ github.workspace }}/upl-iso-build/out
          sha256sum *.iso > checksums.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UPL-OS-ISO
          path: |
            ${{ github.workspace }}/upl-iso-build/out/*.iso
            ${{ github.workspace }}/upl-iso-build/out/checksums.txt
