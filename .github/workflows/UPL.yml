name: Build UPL-OS (Ultra Performance Linux)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upl-build.yml'

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Maximize Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker system prune -af || true

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/pacman-cache
          key: pacman-${{ runner.os }}-${{ hashFiles('.github/workflows/upl-build.yml') }}
          restore-keys: |
            pacman-${{ runner.os }}-

      - name: Create build script
        run: |
          cat > ${{ github.workspace }}/build.sh <<'BUILD_SCRIPT'
          #!/usr/bin/env bash
          set -e

          # ---- تثبيت الأدوات الأساسية (مع مستودع CachyOS) ----
          echo "[*] إعداد الحاوية وتثبيت الأدوات..."
          pacman-key --init
          pacman-key --populate archlinux

          # إضافة مستودع CachyOS مؤقتًا للحصول على cachyos-keyring
          echo "[cachyos]
          Include = /etc/pacman.d/cachyos-mirrorlist" >> /etc/pacman.conf
          mkdir -p /etc/pacman.d
          curl -fL https://mirror.cachyos.org/cachyos-mirrorlist -o /etc/pacman.d/cachyos-mirrorlist

          pacman -Sy --noconfirm archiso git curl reflector cachyos-keyring
          reflector --latest 10 --protocol https --country "United States,Germany,France" --sort rate --save /etc/pacman.d/mirrorlist
          pacman-key --keyserver keyserver.ubuntu.com --recv-keys F3B607488DB35972
          pacman-key --lsign-key F3B607488DB35972

          WORKDIR="/workspace/upl-iso-build"
          PROFILE_DIR="$WORKDIR/archiso"

          echo "[*] تجهيز بيئة البناء..."
          mkdir -p "$WORKDIR"
          rm -rf "$PROFILE_DIR"
          mkdir -p "$PROFILE_DIR"
          cp -r /usr/share/archiso/configs/releng/* "$PROFILE_DIR"
          cd "$PROFILE_DIR"

          # إزالة النواة الافتراضية لتجنب التعارض
          sed -i '/^linux$/d; /^linux-headers$/d' packages.x86_64

          # ---- pacman.conf (مع CacheDir) ----
          cat > pacman.conf <<'EOF'
          [options]
          HoldPkg     = pacman glibc
          Architecture = auto
          SigLevel    = Required DatabaseOptional
          LocalFileSigLevel = Optional
          CacheDir    = /workspace/pacman-cache

          [cachyos-v3]
          Include = /etc/pacman.d/cachyos-v3-mirrorlist
          Priority = 90

          [cachyos]
          Include = /etc/pacman.d/cachyos-mirrorlist
          Priority = 80

          [core]
          Include = /etc/pacman.d/mirrorlist
          [extra]
          Include = /etc/pacman.d/mirrorlist
          [multilib]
          Include = /etc/pacman.d/mirrorlist
          EOF

          # ---- تحميل المرايا للمضيف + airootfs ----
          mkdir -p airootfs/etc/pacman.d
          echo "[*] تحميل مرايا CachyOS..."
          curl -fL https://mirror.cachyos.org/cachyos-v3-mirrorlist -o /etc/pacman.d/cachyos-v3-mirrorlist || exit 1
          curl -fL https://mirror.cachyos.org/cachyos-mirrorlist -o /etc/pacman.d/cachyos-mirrorlist || exit 1
          cp /etc/pacman.d/cachyos-v3-mirrorlist airootfs/etc/pacman.d/cachyos-v3-mirrorlist
          cp /etc/pacman.d/cachyos-mirrorlist airootfs/etc/pacman.d/cachyos-mirrorlist

          # ---- الحزم (بما فيها cachy-chroot) ----
          cat >> packages.x86_64 <<'EOF'
          cachyos-keyring
          cachyos-settings
          cachyos-hooks
          cachy-chroot
          intel-ucode
          amd-ucode
          dkms
          grub
          efibootmgr
          os-prober
          mtools
          dosfstools
          cryptsetup
          linux-cachyos-lts
          linux-cachyos-lts-headers
          linux-firmware
          sof-firmware
          alsa-firmware
          alsa-ucm-conf
          plasma-desktop
          sddm
          plasma-nm
          plasma-systemmonitor
          konsole
          dolphin
          ark
          okular
          gwenview
          spectacle
          kate
          kcalc
          flatpak
          xdg-desktop-portal
          xdg-desktop-portal-kde
          zram-generator
          systemd-oomd
          ananicy-cpp
          ananicy-rules
          power-profiles-daemon
          uksmd
          apparmor
          ufw
          openssh
          btrfs-progs
          timeshift
          snapper
          snap-pac
          grub-btrfs
          inotify-tools
          pipewire
          pipewire-pulse
          pipewire-alsa
          pipewire-jack
          wireplumber
          pavucontrol-qt
          gst-plugin-pipewire
          networkmanager
          network-manager-applet
          bluez
          bluez-utils
          cups
          mesa
          vulkan-intel
          vulkan-radeon
          libva-mesa-driver
          libva-intel-driver
          intel-media-driver
          nvidia-dkms
          nvidia-utils
          lib32-nvidia-utils
          xf86-video-amdgpu
          xf86-video-intel
          htop
          fastfetch
          git
          curl
          wget
          reflector
          sudo
          gparted
          ntfs-3g
          exfatprogs
          f2fs-tools
          calamares
          noto-fonts
          noto-fonts-cjk
          ttf-dejavu
          ttf-liberation
          papirus-icon-theme
          breeze-icons
          firefox
          libreoffice-fresh
          vlc
          gimp
          EOF

          # ---- إعداد المستخدم arch ----
          mkdir -p airootfs/home/arch
          chown -R 1000:1000 airootfs/home/arch
          chmod 750 airootfs/home/arch

          mkdir -p airootfs/etc/sudoers.d
          echo 'arch ALL=(ALL:ALL) NOPASSWD: ALL' > airootfs/etc/sudoers.d/arch
          chmod 440 airootfs/etc/sudoers.d/arch

          # ---- Nvidia KMS ----
          if [ -f airootfs/etc/mkinitcpio.conf ]; then
              sed -i 's/^MODULES=(/MODULES=(nvidia nvidia_modeset nvidia_uvm nvidia_drm /' airootfs/etc/mkinitcpio.conf
          fi

          # ---- sysctl ----
          mkdir -p airootfs/etc/sysctl.d
          cat > airootfs/etc/sysctl.d/99-upl-performance.conf <<'EOF'
          vm.swappiness=80
          vm.vfs_cache_pressure=50
          vm.dirty_ratio=10
          vm.dirty_background_ratio=5
          vm.page-cluster=0
          vm.min_free_kbytes=65536
          kernel.kptr_restrict=2
          kernel.unprivileged_bpf_disabled=1
          kernel.yama.ptrace_scope=1
          kernel.randomize_va_space=2
          net.core.bpf_jit_harden=2
          fs.file-max=2097152
          net.core.default_qdisc=cake
          net.ipv4.tcp_congestion_control=bbr
          net.ipv4.tcp_fastopen=3
          net.ipv4.tcp_syncookies=1
          net.ipv4.conf.all.rp_filter=1
          net.ipv4.conf.default.rp_filter=1
          EOF

          # ---- zram ----
          mkdir -p airootfs/etc/systemd/zram-generator.conf.d
          cat > airootfs/etc/systemd/zram-generator.conf.d/zram.conf <<'EOF'
          [zram0]
          zram-size = min(ram / 2, 4096)
          compression-algorithm = zstd
          swap-priority = 100
          EOF

          # ---- oomd ----
          mkdir -p airootfs/etc/systemd/oomd.conf.d
          cat > airootfs/etc/systemd/oomd.conf.d/99-upl.conf <<'EOF'
          [OOM]
          DefaultMemoryPressureDurationSec=20s
          SwapUsedLimit=90%
          DefaultMemoryPressureLimit=60%
          EOF

          # ---- حدود الذاكرة لـ uksmd ----
          mkdir -p airootfs/etc/systemd/system/uksmd.service.d
          cat > airootfs/etc/systemd/system/uksmd.service.d/limits.conf <<'EOF'
          [Service]
          MemoryMax=512M
          MemoryHigh=384M
          EOF

          # ---- SDDM (Wayland) ----
          mkdir -p airootfs/etc/sddm.conf.d
          cat > airootfs/etc/sddm.conf.d/kde_settings.conf <<'EOF'
          [Autologin]
          User=arch
          Session=plasma

          [General]
          DisplayServer=wayland

          [Theme]
          Current=breeze
          EOF

          enable_service() {
              mkdir -p "airootfs/etc/systemd/system/$2.wants"
              ln -sf "/usr/lib/systemd/system/$1" "airootfs/etc/systemd/system/$2.wants/$1"
          }

          enable_service sddm.service graphical.target
          enable_service NetworkManager.service multi-user.target
          enable_service bluetooth.service multi-user.target
          enable_service ufw.service multi-user.target
          enable_service apparmor.service multi-user.target
          enable_service systemd-oomd.service multi-user.target
          enable_service ananicy-cpp.service multi-user.target
          enable_service power-profiles-daemon.service multi-user.target
          enable_service uksmd.service multi-user.target
          enable_service cups.service multi-user.target
          enable_service sshd.service multi-user.target

          # ---- Reflector (أسبوعي) ----
          cat > airootfs/etc/systemd/system/reflector-update.service <<'RFEOF'
          [Unit]
          Description=Update pacman mirrorlist with reflector
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/reflector --latest 10 --protocol https --sort rate --save /etc/pacman.d/mirrorlist
          StandardOutput=journal
          StandardError=journal
          RFEOF

          cat > airootfs/etc/systemd/system/reflector-update.timer <<'RFETIMER'
          [Unit]
          Description=Weekly reflector update

          [Timer]
          OnBootSec=2min
          OnUnitActiveSec=1w
          AccuracySec=1h
          Persistent=true

          [Install]
          WantedBy=timers.target
          RFETIMER

          enable_service reflector-update.timer timers.target

          # ---- MOTD ----
          cat > airootfs/etc/motd <<'MOTD'
          ┌─────────────────────────────────────────────────────────────┐
          │                  UPL (Ultra Performance Linux)              │
          │                    Arch-based Live ISO                      │
          │                                                             │
          │  Calamares installer will start automatically              │
          │  Or run: sudo calamares                                    │
          │  For system rescue: cachy-chroot                           │
          └─────────────────────────────────────────────────────────────┘
          MOTD

          # ---- Calamares ----
          mkdir -p airootfs/etc/calamares/modules
          cat > airootfs/etc/calamares/modules/shellprocess.conf <<'EOF'
          script: "/usr/local/bin/upl-postinstall.sh"
          timeout: 600
          EOF

          cat > airootfs/etc/calamares/modules/mount.conf <<'EOF'
          btrfsSubvolumes:
              - mountPoint: /
                subvolume: /@
              - mountPoint: /home
                subvolume: /@home
              - mountPoint: /var/cache
                subvolume: /@cache
              - mountPoint: /var/log
                subvolume: /@log
          efiMountPoint: /boot/efi
          EOF

          cat > airootfs/etc/calamares/modules/partition.conf <<'EOF'
          defaultFileSystemType: "btrfs"
          availableFileSystemTypes: ["ext4","btrfs","xfs","f2fs","swap"]
          enableLuksAutomatedPartitioning: true
          allowManualPartitioning: true
          initialPartitioningChoice: "erase"
          efi:
              mountPoint: "/boot/efi"
              recommendedSize: 512MiB
              minimumSize: 256MiB
          EOF

          cat > airootfs/etc/calamares/settings.conf <<'EOF'
          modules-search: [ local, /usr/lib/calamares/modules ]
          instances:
          - show: welcome
          - show: locale
          - show: keyboard
          - show: partition
          - show: users
          - show: summary
          - module: shellprocess
            config: shellprocess.conf
          - show: finished
          sequence:
          - show:
            - welcome
            - locale
            - keyboard
            - partition
            - users
            - summary
          - exec:
            - shellprocess
          - show:
            - finished
          branding: default
          prompt-install: true
          dont-chroot: false
          disable-cancel: false
          quit-at-end: false
          EOF

          # ---- تشغيل Calamares تلقائيًا ----
          mkdir -p airootfs/etc/xdg/autostart
          cat > airootfs/etc/xdg/autostart/calamares.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Version=1.0
          Name=Install System
          Exec=calamares
          Icon=system-software-install
          Categories=System;
          X-GNOME-Autostart-enabled=true
          X-KDE-autostart-after=panel
          NoDisplay=false
          StartupNotify=true
          Terminal=false
          EOF

          # ---- Fallback launcher ----
          cat > airootfs/usr/local/bin/start-calamares.sh <<'STARTCAL'
          #!/bin/bash
          pgrep -x calamares > /dev/null 2>&1 && exit 0
          sleep 5
          exec calamares
          STARTCAL
          chmod +x airootfs/usr/local/bin/start-calamares.sh

          cat > airootfs/etc/systemd/system/calamares-launcher.service <<'CLSVC'
          [Unit]
          Description=Calamares Installer Fallback Launcher
          After=sddm.service
          ConditionFileNotEmpty=/usr/bin/calamares

          [Service]
          Type=simple
          User=arch
          ExecStart=/usr/local/bin/start-calamares.sh
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=graphical.target
          CLSVC
          enable_service calamares-launcher.service graphical.target

          # ---- سكربت ما بعد التثبيت ----
          cat > airootfs/usr/local/bin/upl-postinstall.sh <<'POST'
          #!/bin/bash
          set -e

          cp /usr/local/share/upl/pacman.conf /etc/pacman.conf

          pacman-key --init 2>/dev/null || true
          pacman-key --populate cachyos archlinux 2>/dev/null || true

          for service in uksmd apparmor ufw power-profiles-daemon; do
              systemctl enable "$service" 2>/dev/null || true
          done

          if command -v aa-enforce &>/dev/null; then
              find /etc/apparmor.d/ -maxdepth 1 -type f ! -name '*.dpkg-*' -exec aa-enforce {} + 2>/dev/null || true
          fi

          ufw --force reset 2>/dev/null || true
          ufw default deny incoming
          ufw default allow outgoing
          ufw limit 22/tcp
          ufw --force enable

          if command -v flatpak &>/dev/null; then
              flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo 2>/dev/null || true
          fi

          echo "[*] إعداد GRUB..."
          if [ -d /sys/firmware/efi ]; then
              if mountpoint -q /boot/efi; then
                  grub-install --target=x86_64-efi --efi-directory=/boot/efi --bootloader-id=UPL-OS --removable 2>/dev/null || true
              fi
          else
              ROOT_DEV=$(findmnt -n -o SOURCE / | head -1)
              DISK=$(lsblk -n -o PKNAME "$ROOT_DEV" 2>/dev/null | head -1)
              if [ -n "$DISK" ]; then
                  grub-install --target=i386-pc "/dev/$DISK" 2>/dev/null || true
              fi
          fi

          grub-mkconfig -o /boot/grub/grub.cfg 2>/dev/null || true

          if [ -f /etc/default/grub ]; then
              grep -q "GRUB_DISABLE_OS_PROBER" /etc/default/grub || echo "GRUB_DISABLE_OS_PROBER=false" >> /etc/default/grub
              grub-mkconfig -o /boot/grub/grub.cfg 2>/dev/null || true
          fi

          rm -f /etc/sudoers.d/arch

          if command -v timeshift &>/dev/null; then
              FS_TYPE=$(stat -c %T / 2>/dev/null || echo "unknown")
              if [ "$FS_TYPE" = "btrfs" ]; then
                  timeshift --create --comments "لقطة أولية" --tags D 2>/dev/null || true
              fi
          fi

          echo "[✔] اكتمل الإعداد اللاحق للتثبيت"
          POST
          chmod +x airootfs/usr/local/bin/upl-postinstall.sh

          # ---- حفظ pacman.conf للنظام المثبت ----
          mkdir -p airootfs/usr/local/share/upl
          grep -v "^CacheDir" pacman.conf > airootfs/usr/local/share/upl/pacman.conf

          # ---- ضغط squashfs ----
          if grep -q "^squashfs_options=" profiledef.sh; then
              sed -i "s|^squashfs_options=.*|squashfs_options=\"-comp zstd -Xcompression-level 1\"|" profiledef.sh
          else
              echo "squashfs_options=\"-comp zstd -Xcompression-level 1\"" >> profiledef.sh
          fi

          # ---- بناء ISO ----
          echo "[*] بدء بناء ISO..."
          if ! mkarchiso -v -w "$WORKDIR/archiso-tmp" -o "$WORKDIR/out" "$PROFILE_DIR"; then
              echo "[✗] فشل بناء ISO"
              exit 1
          fi

          rm -rf "$WORKDIR/archiso-tmp"
          if [ $EUID -eq 0 ]; then
              chown -R 1000:1000 "$WORKDIR/out" 2>/dev/null || true
          fi

          ISO_FILE=$(ls -t "$WORKDIR/out"/*.iso 2>/dev/null | head -1)
          if [ -n "$ISO_FILE" ]; then
              SIZE=$(du -h "$ISO_FILE" | cut -f1)
              echo ""
              echo "╔════════════════════════════════════════════════════════╗"
              echo "║             ✅ تم إنشاء ISO بنجاح!                    ║"
              echo "╠════════════════════════════════════════════════════════╣"
              echo "║ المسار: $ISO_FILE"
              echo "║ الحجم:  $SIZE"
              echo "╠════════════════════════════════════════════════════════╣"
              echo "║ الخطوات التالية:                                      ║"
              echo "║ 1. اكتب ISO على USB:                                   ║"
              echo "║    sudo dd if=$ISO_FILE of=/dev/sdX bs=4M status=progress"
              echo "║                                                        ║"
              echo "║ 2. أقلع من USB وابدأ التثبيت عبر Calamares            ║"
              echo "║                                                        ║"
              echo "║ ⏱️  ملاحظة: الإقلاع الأول قد يستغرق دقيقة إضافية     ║"
              echo "║ بسبب بناء DKMS modules لـ Nvidia                       ║"
              echo "╚════════════════════════════════════════════════════════╝"
              echo ""
          else
              echo "[✗] لم يتم العثور على ملف ISO"
              exit 1
          fi
          BUILD_SCRIPT
          chmod +x ${{ github.workspace }}/build.sh

      - name: Build ISO Inside Arch Container
        run: |
          mkdir -p ${{ github.workspace }}/pacman-cache
          docker run --rm --privileged \
            -e HOME=/workspace \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            archlinux:latest \
            bash /workspace/build.sh

      - name: Generate Checksums
        if: success()
        run: |
          cd ${{ github.workspace }}/upl-iso-build/out
          sha256sum *.iso > checksums.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UPL-OS-ISO
          path: |
            ${{ github.workspace }}/upl-iso-build/out/*.iso
            ${{ github.workspace }}/upl-iso-build/out/checksums.txt
