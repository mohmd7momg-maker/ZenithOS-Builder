      - name: Build Initramfs
        run: |
          mkdir -p initramfs/{bin,lib/modules,proc,sys,dev,media,newroot,persistence} iso_root/boot
          cp $(which busybox) initramfs/bin/
          cd initramfs
          for c in sh mount cat ls grep umount switch_root mkdir sleep insmod blkid gunzip xz zstd mdev; do
            ln -sf busybox bin/$c 2>/dev/null
          done

          KVER=$(ls ../rootfs_clean/lib/modules/ | sort -V | tail -1)
          echo "النواة: $KVER"

          for mod in squashfs loop overlay usbhid hid_generic evdev psmouse; do
            src=$(find ../rootfs_clean/lib/modules/$KVER -name "${mod}.ko*" | head -1)
            [ -z "$src" ] && continue
            case "$src" in
              *.xz) xz -d -c "$src" > lib/modules/${mod}.ko ;;
              *.gz) gunzip -c "$src" > lib/modules/${mod}.ko ;;
              *.zst) zstd -d -c "$src" > lib/modules/${mod}.ko ;;
              *) cp "$src" lib/modules/${mod}.ko ;;
            esac
          done

          cat > init <<'INIT'
          #!/bin/busybox sh
          mount -t proc proc /proc
          mount -t sysfs sys /sys
          mount -t devtmpfs dev /dev
          mdev -s

          for m in /lib/modules/*.ko; do insmod $m 2>/dev/null; done

          SQUASH=""
          for i in 1 2 3 4 5; do
            for dev in /dev/sd* /dev/sr* /dev/vd* /dev/nvme*; do
              [ -b "$dev" ] || continue
              mount -o ro "$dev" /media 2>/dev/null || continue
              if [ -f /media/fustuq.squashfs ]; then
                SQUASH="/media/fustuq.squashfs"
                break
              fi
              umount /media 2>/dev/null
            done
            [ -n "$SQUASH" ] && break || sleep 1
          done

          [ -z "$SQUASH" ] && exec /bin/sh
          mount -t squashfs -o ro "$SQUASH" /newroot

          P_DEV=$(blkid -L persistence 2>/dev/null)
          if [ -n "$P_DEV" ]; then
            mount "$P_DEV" /persistence && mkdir -p /persistence/u /persistence/w
            mount -t overlay overlay -o lowerdir=/newroot,upperdir=/persistence/u,workdir=/persistence/w /newroot
          fi

          exec switch_root /newroot /sbin/init
          INIT
          chmod +x init
          find . | cpio -o -H newc | gzip > ../iso_root/boot/initramfs
          cd ..
